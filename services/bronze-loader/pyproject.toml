[project]
name = "tributary-bronze-loader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.5",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
    "tributary-telemetry",
]

[project.scripts]
bronze-loader = "bronze_loader.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
