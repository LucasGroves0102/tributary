[project]
name = "tributary-company-loader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "tributary-sec",
    "tributary-telemetry",
]

[project.scripts]
company-loader = "company_loader.main:main"
company-loader-submissions = "company_loader.bulk:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
company_loader = ["data/*.csv"]
