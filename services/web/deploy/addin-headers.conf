# /addins/ (the Excel add-in's task pane and functions, the Google Sheets script): headers.conf's
# headers with the CSP Office needs. Excel on the web shows the pane in a frame of its own pages, so
# frame-ancestors names Office's web hosts (never 'none' here, never these hosts elsewhere), and
# Office.js loads from Microsoft's CDN. Everything else as the app: no inline script or style, API
# calls to this site only. The other four lines stay identical to headers.conf (addins.test.ts).
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' https://appsforoffice.microsoft.com; connect-src 'self'; frame-ancestors https://*.live.com https://*.office.com https://*.office365.com https://*.microsoft365.com https://*.cloud.microsoft https://*.sharepoint.com; base-uri 'none'; form-action 'self'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy no-referrer always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
