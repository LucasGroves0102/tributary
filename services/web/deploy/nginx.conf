# Cloudflare sets CF-Connecting-IP to the visitor's address; without it (local), the peer's.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # A location with its own add_header drops the server-level ones, so each includes them.
    include /etc/nginx/headers.conf;

    location ~ ^/api/(query|agent)/(docs|redoc|openapi\.json|metrics)(/|$) {
        return 404;
    }

    # agent-api takes demo question quota from the Query API directly; not a public route.
    location ~ ^/api/query/+v1/+demo/+agent-quota {
        return 404;
    }

    # reports are written only by agent-api (straight to the Query API, after verifying every
    # figure); browsers read them through the ordinary item routes.
    location ~ ^/api/query/+v1/+workspaces/+[^/]+/+reports {
        return 404;
    }

    # thesis checks are stored only by agent-api, after verifying every citation and figure;
    # browsers read them through /v1/workspace-items/{id}/checks.
    location ~ ^/api/query/+v1/+thesis-checks {
        return 404;
    }

    # Your data: a dataset upload is a CSV of up to 20 MB (query_api/datasets.py), the only
    # Query API body over nginx's 1 MB default. Exact paths: POST /v1/datasets and
    # /v1/datasets/{id}/upload; the Query API checks the size again before reading anything.
    # (Quoted: nginx reads an unquoted "{" in a regex as the block's start.)
    location ~ "^/api/query/v1/datasets(/[0-9a-f-]{36}/upload)?$" {
        client_max_body_size 21m;
        rewrite ^/api/query/(.*)$ /$1 break;
        proxy_pass http://query-api:8000;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Client-IP $client_ip;
        proxy_read_timeout 120s;
    }

    location /api/query/ {
        proxy_pass http://query-api:8000/;
        proxy_set_header X-Request-ID $request_id;
        # the demo sandbox creation limit and the password sign-in attempt limit are per client
        # address (set here, so a client can't send its own)
        proxy_set_header X-Client-IP $client_ip;
    }

    location /api/agent/ {
        proxy_pass http://agent-api:8001/;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Client-IP $client_ip;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # The MCP server (services/mcp-server): a user's own AI model, authenticated by their API key
    # in the Authorization header (passed on untouched). Exact path only; nothing else of the
    # service (health, metrics) is reachable from outside. Answers are JSON today, but the
    # transport may stream (server-sent events): no buffering, a long read timeout.
    location = /mcp {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://mcp-server:8002/mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 1m;
    }

    # Connected apps (MCP OAuth, query_api/oauth.py): the authorization server's metadata and
    # endpoints at the site's root, where MCP clients look for them (RFC 8414; the issuer is the
    # site). /oauth/authorize sends the browser on to the app's consent page (#/connect); the
    # registration and metadata-document limits are per client address, set here.
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://query-api:8000/.well-known/oauth-authorization-server;
        proxy_set_header X-Request-ID $request_id;
    }

    location /oauth/ {
        proxy_pass http://query-api:8000/oauth/;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Client-IP $client_ip;
        client_max_body_size 64k;
        # /oauth/authorize's Location carries the sealed request (up to ~8 KB)
        proxy_buffer_size 16k;
    }

    # The MCP server's protected resource metadata (RFC 9728): how a client learns where to sign
    # in. The path form and the root form (clients try both). Any other well-known path is a 404,
    # never the app's page (a client reading HTML as metadata fails in confusing ways).
    location ~ ^/\.well-known/oauth-protected-resource(/mcp)?$ {
        proxy_pass http://mcp-server:8002;
        proxy_set_header X-Request-ID $request_id;
    }

    location /.well-known/ {
        return 404;
    }

    # The spreadsheet add-ins (public/addins): Excel's manifest, task pane and functions, and the
    # Google Sheets script. Their own headers (addin-headers.conf: Office may frame these pages and
    # they load Office.js); no-transform as for the page; no-cache so an update reaches Office.
    # Nothing here falls back to the app's index.html. The script reads as text in a browser.
    location /addins/ {
        include /etc/nginx/addin-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        try_files $uri =404;

        location ~ \.gs$ {
            types { }
            default_type text/plain;
            charset utf-8;
        }
    }

    location /assets/ {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # no-transform: Cloudflare must serve the page as built. Its Web Analytics "automatic setup"
    # injects a beacon script from another origin into the HTML, which the CSP (rightly) blocks:
    # an error in every visitor's console. Cloudflare doesn't inject into a no-transform response.
    location / {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "no-transform";
        try_files $uri /index.html;
    }
}
