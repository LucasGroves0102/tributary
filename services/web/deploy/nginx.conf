# Cloudflare sets CF-Connecting-IP to the visitor's address; without it (local), the peer's.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # A location with its own add_header drops the server-level ones, so each includes them.
    include /etc/nginx/headers.conf;

    location ~ ^/api/(query|agent)/(docs|redoc|openapi\.json|metrics)(/|$) {
        return 404;
    }

    # agent-api takes demo question quota from the Query API directly; not a public route.
    location ~ ^/api/query/+v1/+demo/+agent-quota {
        return 404;
    }

    location /api/query/ {
        proxy_pass http://query-api:8000/;
        proxy_set_header X-Request-ID $request_id;
        # the demo sandbox creation limit is per client address
        proxy_set_header X-Client-IP $client_ip;
    }

    location /api/agent/ {
        proxy_pass http://agent-api:8001/;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Client-IP $client_ip;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
