server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;

    # A location with its own add_header drops the server-level ones, so each includes them.
    include /etc/nginx/headers.conf;

    location ~ ^/api/(query|agent)/(docs|redoc|openapi\.json|metrics)(/|$) {
        return 404;
    }

    location /api/query/ {
        proxy_pass http://query-api:8000/;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/agent/ {
        proxy_pass http://agent-api:8001/;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        include /etc/nginx/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
