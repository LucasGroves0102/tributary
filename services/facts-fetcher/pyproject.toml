[project]
name = "tributary-facts-fetcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "tributary-sec",
    "tributary-telemetry",
]

[project.scripts]
facts-fetcher = "facts_fetcher.main:main"
facts-fetcher-bulk = "facts_fetcher.bulk:main"
facts-fetcher-segments = "facts_fetcher.segments:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
facts_fetcher = ["data/*.csv"]
