[project]
name = "tributary-parser"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.5",
    "lxml>=5.0",
    "psycopg[binary]>=3.2",
]

[project.scripts]
parser = "filing_parser.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
