[package]
name = "parser-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "filing_parser"

[dependencies]
encoding_rs = "0.8"
flate2 = "1"
native-tls = "0.2"
postgres = { version = "0.19", default-features = false }
postgres-native-tls = "0.5"
prometheus = { version = "0.14", default-features = false, features = ["process"] }
rdkafka = { version = "0.39", default-features = false, features = ["libz-static", "ssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = { version = "0.4", default-features = false }

[profile.release]
lto = true
codegen-units = 1
