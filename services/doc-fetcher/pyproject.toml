[project]
name = "tributary-doc-fetcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "confluent-kafka>=2.5",
    "httpx>=0.27",
    "lxml>=5.0",
    "psycopg[binary]>=3.2",
    "tributary-sec",
]

[project.scripts]
doc-fetcher = "doc_fetcher.main:main"
doc-fetcher-seed = "doc_fetcher.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
