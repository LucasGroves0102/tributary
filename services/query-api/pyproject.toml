[project]
name = "tributary-query-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pyjwt>=2.9",
    "httpx>=0.27",  # GitHub sign-in (query_api.github), market-data providers
    "cryptography>=43",  # market-data keys at rest (query_api.keybox, AES-GCM)
    "tributary-authz",
    "prometheus-client>=0.20",
    "tributary-telemetry",
    "tzdata",  # zoneinfo data for America/New_York on slim images
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.scripts]
query-api = "query_api.main:main"
query-api-token = "query_api.auth:mint_cli"
query-api-demo-cleanup = "query_api.sandbox:cleanup_main"
query-api-account = "query_api.password_accounts:cli_main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
query_api = ["data/*.json"]
