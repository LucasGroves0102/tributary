[project]
name = "tributary-query-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "pyjwt>=2.9",
    "tributary-authz",
    "prometheus-client>=0.20",
    "tributary-telemetry",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.scripts]
query-api = "query_api.main:main"
query-api-token = "query_api.auth:mint_cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
