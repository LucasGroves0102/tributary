[project]
name = "tributary-poller"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tributary-sec",
    "tzdata",  # zoneinfo data for America/New_York on slim images
    "confluent-kafka>=2.5",
    "prometheus-client>=0.20",
    "tributary-telemetry",
]

[project.scripts]
poller = "poller.main:main"
poller-backfill = "poller.backfill:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
