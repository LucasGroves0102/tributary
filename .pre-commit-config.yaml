# Install once per clone: make hooks
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks  # blocks commits that contain secrets (staged changes only)
  - repo: local
    hooks:
      - id: secrets-encrypted
        name: deploy/secrets encrypted with sops
        entry: python scripts/check-secrets-encrypted.py
        language: python
        additional_dependencies: [pyyaml==6.0.3]
        files: ^deploy/secrets/
        pass_filenames: false
