# Tributary's Postgres settings on hermes: installed as /etc/postgresql/16/main/conf.d/tributary.conf
# (deploy/host README, "Postgres settings"). shared_buffers needs a restart; the rest a reload.

wal_level = logical                 # Debezium's logical replication of the app database
listen_addresses = '*'              # pods reach it over the k3s bridge; pg_hba.conf limits who
max_slot_wal_keep_size = 20GB       # a stuck replication slot can't fill the disk with WAL

# Memory (2026-11-25). Hermes has 15 GB; k3s, Kafka, Kafka Connect, Prometheus and the services
# use about 4-5 GB. Until then these were Ubuntu's defaults (128MB, 4MB, 64MB): sorts and joins
# over 4 MB spilled to temp files, 4,155 GB of them since the database was created, and 83% of
# reads came from Postgres's cache.
shared_buffers = 3GB                # Postgres's own cache (was 128MB)
effective_cache_size = 8GB          # what the planner may assume Postgres + the OS cache hold
work_mem = 32MB                     # per sort or hash, per query step (was 4MB)
maintenance_work_mem = 1GB          # VACUUM, CREATE INDEX (was 64MB)
autovacuum_work_mem = 256MB         # each of the 3 autovacuum workers (else maintenance_work_mem)
