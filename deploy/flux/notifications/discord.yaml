apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Provider
metadata:
  name: discord
  namespace: flux-system
spec:
  type: discord
  secretRef:
    name: discord-webhook
---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: deploys
  namespace: flux-system
spec:
  providerRef:
    name: discord
  eventSeverity: info
  eventSources:
    - kind: HelmRelease
      name: "*"
      namespace: platform
    - kind: HelmRelease
      name: "*"
      namespace: tributary
    - kind: HelmRelease
      name: "*"
      namespace: monitoring
    - kind: Kustomization
      name: "*"
    - kind: ImageUpdateAutomation
      name: "*"
  exclusionList:
    - ".*no changes.*"
