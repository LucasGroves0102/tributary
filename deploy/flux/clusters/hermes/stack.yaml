# Applied in order: namespaces, then secrets (decrypted with the age key in sops-age), then the
# Helm releases, image automation and notifications.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: flux-system
spec:
  interval: 1h
  path: ./deploy/flux/namespaces
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: 10m
  path: ./deploy/secrets
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: releases
  namespace: flux-system
spec:
  dependsOn:
    - name: secrets
  interval: 10m
  path: ./deploy/flux/releases
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: images
  namespace: flux-system
spec:
  dependsOn:
    - name: secrets
  interval: 10m
  path: ./deploy/flux/images
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: notifications
  namespace: flux-system
spec:
  dependsOn:
    - name: secrets
  interval: 10m
  path: ./deploy/flux/notifications
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
