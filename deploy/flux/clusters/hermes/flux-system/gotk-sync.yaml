apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: ssh://git@github.com/LucasGroves0102/tributary.git
  ref:
    branch: main
  secretRef:
    name: flux-system
  ignore: |
    /*
    !/deploy/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/flux/clusters/hermes
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
