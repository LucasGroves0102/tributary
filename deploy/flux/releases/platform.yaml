apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform
  namespace: platform
spec:
  releaseName: platform
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/helm/platform
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    kafka:
      sasl:
        enabled: true
        connect: true
      plaintextListener: false
    openfga:
      auth:
        enabled: true
    images:
      setup:
        tag: main-178-6afc91c524d1d0e2469caaa1563288750ca4e705 # {"$imagepolicy": "flux-system:tributary:tag"}
