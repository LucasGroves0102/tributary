apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform
  namespace: platform
spec:
  releaseName: platform
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/helm/platform
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    kafka:
      sasl:
        enabled: true
        connect: true
      plaintextListener: false
    openfga:
      auth:
        enabled: true
    images:
      setup:
        tag: main-190-d221bfa7a440d4ec4d5b8281ebf48f3f46e5f8ff # {"$imagepolicy": "flux-system:tributary:tag"}
