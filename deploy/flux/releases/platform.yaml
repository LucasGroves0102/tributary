apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform
  namespace: platform
spec:
  releaseName: platform
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/helm/platform
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    openfga:
      auth:
        enabled: true
    images:
      setup:
        tag: main-112-13ab8f5b97af31cea0ac4fff0e90e1d17c1abe49 # {"$imagepolicy": "flux-system:tributary:tag"}
