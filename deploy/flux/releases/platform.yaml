apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: platform
  namespace: platform
spec:
  releaseName: platform
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/helm/platform
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    images:
      setup:
        tag: main-66-66a0916bfe56fb6c02c60fed0b4dee96992b1921 # {"$imagepolicy": "flux-system:tributary:tag"}
