apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tributary
  namespace: tributary
spec:
  releaseName: tributary
  dependsOn:
    - name: platform
      namespace: platform
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/helm/tributary
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    openfga:
      auth:
        enabled: true
    # doc-crawler stays on after the 5-year crawl (finished 2026-10-22): every CRAWL_PLAN_HOURS it
    # queues new 10-K/10-Q/8-K filings of every operating company, while the live doc-fetcher only
    # covers tracked companies. Scaling it to 0 stops documents for everyone else.
    services:
      parser-backfill:
        replicas: 1
      doc-crawler:
        replicas: 1
    # The jobs that read the crawled documents run hourly.
    jobs:
      segments:
        suspend: false
      section-index:
        suspend: false
    image:
      tag: main-147-b38580a9706f4e3046c7b74f2b130ce28ef275f2 # {"$imagepolicy": "flux-system:tributary:tag"}
