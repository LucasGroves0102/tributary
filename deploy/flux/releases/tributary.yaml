apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tributary
  namespace: tributary
spec:
  releaseName: tributary
  dependsOn:
    - name: platform
      namespace: platform
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/helm/tributary
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    services:
      parser:
        image: parser-rs
      parser-backfill:
        image: parser-rs
    image:
      tag: main-89-25169eefe1dca9cbfefdedb6f2070a6ed15e1d77 # {"$imagepolicy": "flux-system:tributary:tag"}
