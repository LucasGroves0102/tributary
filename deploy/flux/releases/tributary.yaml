apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tributary
  namespace: tributary
spec:
  releaseName: tributary
  dependsOn:
    - name: platform
      namespace: platform
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/helm/tributary
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    kafka:
      sasl:
        enabled: true
    openfga:
      auth:
        enabled: true
    # Named demo users (alice, bob, carol, dave) are test personas only (2026-11-02): no
    # /v1/demo/token for them in production and no re-seeding. Visitors use a demo sandbox or
    # GitHub sign-in; the sandbox has its own switch (demo.sandbox.enabled) and stays on.
    demo:
      enabled: false
    # doc-crawler stays on after the 5-year crawl (finished 2026-10-22): every CRAWL_PLAN_HOURS it
    # queues new 10-K/10-Q/8-K filings of every operating company, while the live doc-fetcher only
    # covers tracked companies. Scaling it to 0 stops documents for everyone else.
    services:
      parser-backfill:
        replicas: 1
      doc-crawler:
        replicas: 1
    # The jobs that read the crawled documents run hourly.
    jobs:
      segments:
        suspend: false
      section-index:
        suspend: false
    image:
      tag: main-186-095c1a61fc4628b89a364c63b1d18e42ed80b74c # {"$imagepolicy": "flux-system:tributary:tag"}
