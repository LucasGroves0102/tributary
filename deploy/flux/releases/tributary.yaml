apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tributary
  namespace: tributary
spec:
  releaseName: tributary
  dependsOn:
    - name: platform
      namespace: platform
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/helm/tributary
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    kafka:
      sasl:
        enabled: true
    openfga:
      auth:
        enabled: true
    # Named demo users (alice, bob, carol, dave) are test personas only (2026-11-02): no
    # /v1/demo/token for them in production and no re-seeding. Visitors use a demo sandbox or
    # GitHub sign-in; the sandbox has its own switch (demo.sandbox.enabled) and stays on.
    demo:
      enabled: false
    # doc-crawler stays on after the 5-year crawl (finished 2026-10-22): every CRAWL_PLAN_HOURS it
    # queues what the live doc-fetcher leaves (amendments, daily-index filings, other 8-Ks, fetch
    # errors); doc-fetcher stores operating companies' new 10-K/10-Q/material 8-Ks within minutes
    # since 2026-11-09. Scaling the crawler to 0 stops that catch-up.
    services:
      parser-backfill:
        replicas: 1
      doc-crawler:
        replicas: 1
      # Owner-created password accounts (query-api-account) have their own daily assistant cap;
      # a tester on the owner's network shares the owner's address, so 10 questions per IP per
      # hour would stop both. Sandboxes and GitHub accounts stay capped per day in the Query
      # API, and the daily model budget still bounds spend. Helm merges this into the chart's env.
      agent-api:
        env:
          AGENT_IP_RATE_PER_HOUR: "40"
    # The jobs that read the crawled documents run hourly.
    jobs:
      segments:
        suspend: false
      section-index:
        suspend: false
      # Backfilled by hand on 2026-11-09 (filing-facts-1: 293 filings since 2019).
      filing-facts:
        suspend: false
    image:
      tag: main-240-6b4d858be795a91263b5b46694cf282fc5e6e58a # {"$imagepolicy": "flux-system:tributary:tag"}
