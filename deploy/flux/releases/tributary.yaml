apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tributary
  namespace: tributary
spec:
  releaseName: tributary
  dependsOn:
    - name: platform
      namespace: platform
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/helm/tributary
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    openfga:
      auth:
        enabled: true
    services:
      parser-backfill:
        replicas: 1
      doc-crawler:
        replicas: 1
    image:
      tag: main-133-ecb15b668ebbc8ab68a1d6e6104f53ac2d250b91 # {"$imagepolicy": "flux-system:tributary:tag"}
