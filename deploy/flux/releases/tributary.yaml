apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tributary
  namespace: tributary
spec:
  releaseName: tributary
  dependsOn:
    - name: platform
      namespace: platform
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: ./deploy/helm/tributary
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    openfga:
      auth:
        enabled: true
    # The document crawl finished 2026-10-22 (265,625 filings); doc-crawler and parser-backfill
    # are back at the chart default of 0. The jobs that read the crawled documents run hourly.
    jobs:
      segments:
        suspend: false
      section-index:
        suspend: false
    image:
      tag: main-140-27536cfa00a76415ce35791a7ba301794822d815 # {"$imagepolicy": "flux-system:tributary:tag"}
