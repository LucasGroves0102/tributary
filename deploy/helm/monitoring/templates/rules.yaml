apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tributary
  labels:
    app.kubernetes.io/part-of: tributary-monitoring
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  groups:
    - name: tributary
      rules:
        - alert: KafkaConsumerLagGrowing
          expr: |
            sum by (consumergroup) (kafka_consumergroup_lag) > 0
            and sum by (consumergroup) (deriv(kafka_consumergroup_lag[15m])) > 0
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "{{`{{ $labels.consumergroup }}`}} is falling behind ({{`{{ $value | humanize }}`}} messages and growing)"
        - alert: FilingsNotArriving
          # Weekdays 14:00-21:00 UTC, when EDGAR always has new filings.
          expr: |
            sum(increase(kafka_topic_partition_current_offset{topic="filings.raw"}[2h])) == 0
            and on () day_of_week() > 0 < 6
            and on () hour() >= 14 < 21
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: No new filings published to filings.raw in 2 hours
        # Freshness (README "Freshness"): bronze-loader counts every row it writes by the event's
        # source and times the live ones; filings-recheck republishes what the poller missed as
        # source recheck. Measured on hermes 2026-10-20 to 2026-11-27, before the poller paged
        # (bronze.filings; misses timed by bronze.submission_filings). Weekdays only, at hours
        # when EDGAR lists filings as it accepts them: nothing 10 pm-6 am ET, and at 6 am it lists
        # the evening's late ones, hours old by design (the recheck's 6:05 and 7:05 runs find them).
        - alert: FeedCatchRateLow
          # The live poller's share of the filer rows written in 3 hours, against those the hourly
          # recheck had to republish. Weekdays from 16:00 UTC (11 am EST, noon EDT): the window
          # then starts at 8 am ET or later. Measured, weekday 3-hour windows ending 11 am-6 pm ET (216):
          # median 100%, 10th percentile 97%; under 90% in 9, all on 2026-11-16 (the 13F and 10-Q
          # deadline, 40% at worst) and 2026-11-19 (a stall); every window had 427 rows or more.
          expr: |
            sum(increase(tributary_bronze_filings_total{result="inserted", source="feed"}[3h]))
              / sum(increase(tributary_bronze_filings_total{result="inserted", source=~"feed|recheck"}[3h]))
              < 0.9
            and on () sum(increase(tributary_bronze_filings_total{result="inserted", source=~"feed|recheck"}[3h])) > 300
            and on () day_of_week() > 0 < 6
            and on () hour() >= 16
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "The live feed caught only {{`{{ $value | humanizePercentage }}`}} of the last 3 hours' filings; the hourly recheck found the rest"
        - alert: FeedLatencyHigh
          # 95th percentile over an hour of EDGAR acceptance to bronze for the live poller's filings
          # (tributary_bronze_filing_latency_seconds{source="feed"}), 50 or more of them, weekdays
          # 14:00-22:59 UTC (9 am-6 pm EST, 10 am-7 pm EDT). Measured, weekday hours 8 am-6 pm ET
          # with 50+ rows (270): median 66 s, 90th percentile 148 s, 95th 249 s; over 10 minutes
          # in 8, all on 2026-11-16 and 2026-11-19 (up to an hour behind).
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(tributary_bronze_filing_latency_seconds_bucket{source="feed"}[1h]))) > 600
            and on () sum(increase(tributary_bronze_filing_latency_seconds_count{source="feed"}[1h])) >= 50
            and on () day_of_week() > 0 < 6
            and on () hour() >= 14 < 23
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "95% of live filings took up to {{`{{ $value | humanizeDuration }}`}} from EDGAR to Postgres in the last hour"
        - alert: FilingRecheckFindingMany
          # Rows the hourly recheck republished in an hour (one run): the poller is missing more
          # than bursts. Weekdays from 15:00 UTC, so the hour holds no 6 or 7 am ET run. Measured,
          # rows missed per weekday acceptance hour 9 am-5 pm ET (243): median 0, 95th percentile
          # 66, normal days' worst 129 (5 pm, the close's burst); over 150 in 3, all on 2026-11-16.
          expr: |
            sum(increase(tributary_bronze_filings_total{result="inserted", source="recheck"}[1h])) > 150
            and on () day_of_week() > 0 < 6
            and on () hour() >= 15
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "The hourly recheck found {{`{{ $value | humanize }}`}} filer rows the live poller missed in the last hour"
        - alert: FilingRecheckNotSucceeding
          # kube-state-metrics: the filings-recheck CronJob (weekdays hourly 06:05-23:05 New York)
          # hasn't finished a run in 3 hours, weekdays from 13:00 UTC (8 am EST, 9 am EDT: after
          # the day's first two runs). A failed Job also raises the stack's KubeJobFailed; this
          # says it stopped running at all. Not while the CronJob is suspended.
          expr: |
            time() - max(kube_cronjob_status_last_successful_time{namespace="tributary", cronjob="filings-recheck"}) > 3 * 3600
            and on () max(kube_cronjob_spec_suspend{namespace="tributary", cronjob="filings-recheck"}) == 0
            and on () day_of_week() > 0 < 6
            and on () hour() >= 13
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "The hourly filings recheck hasn't finished a run in {{`{{ $value | humanizeDuration }}`}}"
        - alert: CompanyFactsBehindEdgar
          # ops-exporter (opsDatabase.enabled); the financials job runs nightly.
          expr: max by (company) (tributary_companyfacts_behind_seconds) > 3 * 86400
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: "{{`{{ $labels.company }}`}} has a 10-K/10-Q on EDGAR from {{`{{ $value | humanizeDuration }}`}} ago that the SEC companyfacts API doesn't reflect"
        # No backup alerts: hermes runs without backups since 2026-11-24 (deploy/host README).
        - alert: PostgresDown
          expr: pg_up == 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: The exporter cannot reach Postgres on the host
        - alert: ReplicationSlotRetainingWal
          # A slot that stops advancing pins WAL for every database on the server.
          expr: max by (slot_name) (pg_replication_slots_pg_wal_lsn_diff) > 10e9
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "Replication slot {{`{{ $labels.slot_name }}`}} is holding {{`{{ $value | humanize1024 }}`}}B of WAL"
        - alert: PostgresConnectionsHigh
          expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Postgres is using {{`{{ $value | humanizePercentage }}`}} of max_connections"
        - alert: DiskUsageHigh
          expr: 1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} > 0.8
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "Root filesystem is {{`{{ $value | humanizePercentage }}`}} full"
        - alert: DiskSpaceUnder100GB
          # Time to plan, before DiskSpaceLow: the foreign filers' documents (migration 095) and the
          # parser catch-up grow the database; README "Disk space" says what to look at first.
          expr: node_filesystem_avail_bytes{mountpoint="/"} < 100e9
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "{{`{{ $value | humanize1024 }}`}}B free on the root filesystem (under 100 GB)"
        - alert: DiskSpaceLow
          # The document crawl pauses itself under 50 GB free (CRAWL_MIN_FREE_GB); this catches
          # everything else that fills the disk (WAL held by a slot, backups, the crawl's parser).
          expr: node_filesystem_avail_bytes{mountpoint="/"} < 50e9
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: "Only {{`{{ $value | humanize1024 }}`}}B free on the root filesystem"
        - alert: DocCrawlPausedForDisk
          # doc-crawler (tributary chart, services.doc-crawler) stops fetching under its threshold.
          expr: |
            max(tributary_doc_crawl_disk_free_bytes)
            < on () max(tributary_doc_crawl_min_free_bytes)
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Document crawl paused by its disk guard: {{`{{ $value | humanize1024 }}`}}B free"
        - alert: CatchupStalled
          # ops-exporter: stored data an older rule built (parser, passages, gold, checks; migration
          # 071) that the hourly section-index and segments jobs haven't moved in a day: the jobs
          # failing or suspended, the crawl busy, parser-backfill stopped, or errors (their logs).
          expr: |
            max by (kind) (tributary_catchup_behind) > 0
            and on (kind) max by (kind) (tributary_catchup_paused) == 0
            and on (kind) time() - max by (kind) (tributary_catchup_progress_timestamp_seconds) > 86400
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: "Catch-up of {{`{{ $labels.kind }}`}} has made no progress in a day (ops.catchup_status)"
        - alert: DocCrawlStalled
          # Work left, not paused (by hand or for disk), and nothing finished for 30 minutes:
          # SEC errors, everything left in retry backoff, Postgres or a hung fetch.
          expr: |
            max(tributary_doc_crawl_remaining_filings) > 0
            and on () max(tributary_doc_crawl_state{state=~"running|idle|erroring"}) == 1
            and on () time() - max(tributary_doc_crawl_last_progress_timestamp_seconds) > 1800
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "Document crawl has {{`{{ $value | humanize }}`}} filings left and made no progress in 30 minutes"
