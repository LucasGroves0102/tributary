apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tributary
  labels:
    app.kubernetes.io/part-of: tributary-monitoring
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  groups:
    - name: tributary
      rules:
        - alert: KafkaConsumerLagGrowing
          expr: |
            sum by (consumergroup) (kafka_consumergroup_lag) > 0
            and sum by (consumergroup) (deriv(kafka_consumergroup_lag[15m])) > 0
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "{{`{{ $labels.consumergroup }}`}} is falling behind ({{`{{ $value | humanize }}`}} messages and growing)"
        - alert: FilingsNotArriving
          # Weekdays 14:00-21:00 UTC, when EDGAR always has new filings.
          expr: |
            sum(increase(kafka_topic_partition_current_offset{topic="filings.raw"}[2h])) == 0
            and on () day_of_week() > 0 < 6
            and on () hour() >= 14 < 21
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: No new filings published to filings.raw in 2 hours
        - alert: CompanyFactsBehindEdgar
          # ops-exporter (opsDatabase.enabled); the financials job runs nightly.
          expr: max by (company) (tributary_companyfacts_behind_seconds) > 3 * 86400
          for: 1h
          labels: {severity: warning}
          annotations:
            summary: "{{`{{ $labels.company }}`}} has a 10-K/10-Q on EDGAR from {{`{{ $value | humanizeDuration }}`}} ago that the SEC companyfacts API doesn't reflect"
        - alert: PostgresBackupMissing
          expr: |
            time() - pg_backup_last_success_timestamp_seconds > 26 * 3600
            or absent(pg_backup_last_success_timestamp_seconds)
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: No successful Postgres backup in the last 26 hours
        # deploy/host/pg-restore-test.sh, weekly: the latest full backup restored into a throwaway
        # Postgres instance and every table's row count checked against the dump's
        - alert: PostgresRestoreTestFailed
          expr: pg_restore_test_last_result == 0
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: The weekly restore test of the latest Postgres backup failed (journalctl -u pg-restore-test)
        - alert: PostgresRestoreTestMissing
          expr: |
            time() - pg_restore_test_last_success_timestamp_seconds > 8 * 86400
            or absent(pg_restore_test_last_success_timestamp_seconds)
          for: 1h
          labels: {severity: critical}
          annotations:
            summary: No passing Postgres restore test in the last 8 days
        - alert: PostgresDown
          expr: pg_up == 0
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: The exporter cannot reach Postgres on the host
        - alert: ReplicationSlotRetainingWal
          # A slot that stops advancing pins WAL for every database on the server.
          expr: max by (slot_name) (pg_replication_slots_pg_wal_lsn_diff) > 10e9
          for: 30m
          labels: {severity: warning}
          annotations:
            summary: "Replication slot {{`{{ $labels.slot_name }}`}} is holding {{`{{ $value | humanize1024 }}`}}B of WAL"
        - alert: PostgresConnectionsHigh
          expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: "Postgres is using {{`{{ $value | humanizePercentage }}`}} of max_connections"
        - alert: DiskUsageHigh
          expr: 1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} > 0.8
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "Root filesystem is {{`{{ $value | humanizePercentage }}`}} full"
        - alert: DiskSpaceLow
          # The document crawl pauses itself under 50 GB free (CRAWL_MIN_FREE_GB); this catches
          # everything else that fills the disk (WAL held by a slot, backups, the crawl's parser).
          expr: node_filesystem_avail_bytes{mountpoint="/"} < 50e9
          for: 10m
          labels: {severity: critical}
          annotations:
            summary: "Only {{`{{ $value | humanize1024 }}`}}B free on the root filesystem"
        - alert: DocCrawlPausedForDisk
          # doc-crawler (tributary chart, services.doc-crawler) stops fetching under its threshold.
          expr: |
            max(tributary_doc_crawl_disk_free_bytes)
            < on () max(tributary_doc_crawl_min_free_bytes)
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: "Document crawl paused by its disk guard: {{`{{ $value | humanize1024 }}`}}B free"
        - alert: DocCrawlStalled
          # Work left, not paused (by hand or for disk), and nothing finished for 30 minutes:
          # SEC errors, everything left in retry backoff, Postgres or a hung fetch.
          expr: |
            max(tributary_doc_crawl_remaining_filings) > 0
            and on () max(tributary_doc_crawl_state{state=~"running|idle|erroring"}) == 1
            and on () time() - max(tributary_doc_crawl_last_progress_timestamp_seconds) > 1800
          for: 15m
          labels: {severity: warning}
          annotations:
            summary: "Document crawl has {{`{{ $value | humanize }}`}} filings left and made no progress in 30 minutes"
