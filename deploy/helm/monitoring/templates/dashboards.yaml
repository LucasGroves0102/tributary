{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
# Picked up by the Grafana dashboard sidecar.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: tributary-monitoring
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
data:
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
---
{{- end }}
