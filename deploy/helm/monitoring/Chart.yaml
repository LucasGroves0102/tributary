apiVersion: v2
name: monitoring
description: Metrics, logs and alerts for hermes and Tributary
type: application
version: 0.1.0
kubeVersion: ">=1.30.0-0"
dependencies:
  - name: kube-prometheus-stack
    version: 92.10.1
    repository: https://prometheus-community.github.io/helm-charts
  - name: loki
    version: 7.3.0
    repository: https://grafana.github.io/helm-charts
  - name: alloy
    version: 1.14.0
    repository: https://grafana.github.io/helm-charts
  - name: prometheus-postgres-exporter
    version: 8.2.0
    repository: https://prometheus-community.github.io/helm-charts
  - name: prometheus-postgres-exporter
    alias: ops-exporter
    version: 8.2.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: opsDatabase.enabled
  - name: prometheus-kafka-exporter
    version: 4.0.0
    repository: https://prometheus-community.github.io/helm-charts
