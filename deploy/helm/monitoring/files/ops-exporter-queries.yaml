# postgres_exporter --extend.query-path: metrics from the tributary database's ops views.
tributary_companyfacts:
  query: |
    SELECT company_id, company, missing_filings, behind_seconds
    FROM ops.companyfacts_lag
  cache_seconds: 300
  metrics:
    - company_id:
        usage: LABEL
        description: Company ID (first CIK in its lineage)
    - company:
        usage: LABEL
        description: Company name
    - missing_filings:
        usage: GAUGE
        description: 10-K/10-Q filings on EDGAR that the SEC companyfacts API doesn't reflect yet
    - behind_seconds:
        usage: GAUGE
        description: Seconds since the oldest such filing was accepted, 0 when up to date
tributary_financials_quality:
  query: |
    SELECT check_name, severity, findings, companies
    FROM ops.quality_summary
  cache_seconds: 300
  metrics:
    - check_name:
        usage: LABEL
        description: Data-quality check on gold financials (ops.check_financials)
    - severity:
        usage: LABEL
        description: error or warning
    - findings:
        usage: GAUGE
        description: Findings of the check in each company's latest run
    - companies:
        usage: GAUGE
        description: Companies with at least one finding
tributary_doc_crawl:
  query: |
    SELECT form, sum(targets) AS targets, sum(done) AS done, sum(remaining) AS remaining,
           sum(failed) AS failed, sum(skipped) AS skipped, sum(raw_bytes) AS raw_bytes,
           sum(stored_bytes) AS stored_bytes
    FROM ops.doc_crawl_progress
    GROUP BY form
  cache_seconds: 300
  metrics:
    - form:
        usage: LABEL
        description: 10-K, 10-K/A, 10-Q, 10-Q/A or 8-K
    - targets:
        usage: GAUGE
        description: Filings queued by the document crawl (ops.doc_crawl_targets)
    - done:
        usage: GAUGE
        description: Filings stored (or found already stored)
    - remaining:
        usage: GAUGE
        description: Filings pending or claimed
    - failed:
        usage: GAUGE
        description: Filings given up on (SEC 404 or out of retries)
    - skipped:
        usage: GAUGE
        description: Filings skipped as unusable (too large, empty, no primary document)
    - raw_bytes:
        usage: GAUGE
        description: Uncompressed bytes stored
    - stored_bytes:
        usage: GAUGE
        description: Gzip bytes stored
