# postgres_exporter --extend.query-path: metrics from the tributary database's ops views.
tributary_companyfacts:
  query: |
    SELECT company_id, company, missing_filings, behind_seconds
    FROM ops.companyfacts_lag
  cache_seconds: 300
  metrics:
    - company_id:
        usage: LABEL
        description: Company ID (first CIK in its lineage)
    - company:
        usage: LABEL
        description: Company name
    - missing_filings:
        usage: GAUGE
        description: 10-K/10-Q filings on EDGAR that the SEC companyfacts API doesn't reflect yet
    - behind_seconds:
        usage: GAUGE
        description: Seconds since the oldest such filing was accepted, 0 when up to date
tributary_financials_quality:
  query: |
    SELECT check_name, severity, findings, companies
    FROM ops.quality_summary
  cache_seconds: 300
  metrics:
    - check_name:
        usage: LABEL
        description: Data-quality check on gold financials (ops.check_financials)
    - severity:
        usage: LABEL
        description: error or warning
    - findings:
        usage: GAUGE
        description: Findings of the check in each company's latest run
    - companies:
        usage: GAUGE
        description: Companies with at least one finding
