{{- /* The body store (migration 150): every stored document and exhibit body as a zstd file
named by its SHA-256, mounted at /bodies by `uses: bodies` (writers) and `bodies-ro` (readers).
A local-path volume on the node's disk (k3s's default StorageClass creates its directory writable
by the pods' non-root user; the namespace's restricted Pod Security forbids hostPath volumes in
pods). Kept when the release is uninstalled; backups: deploy/host README "Document bodies". */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.bodies.claimName }}
  labels:
    {{- include "tributary.labels" (dict "root" . "name" "document-bodies") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.bodies.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.bodies.size }}
