# Postgres runs on the host, outside the cluster; pods reach it as postgres:5432.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "tributary.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
spec:
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: postgres-host
  labels:
    kubernetes.io/service-name: postgres
    {{- include "tributary.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
addressType: IPv4
ports:
  - name: postgres
    port: {{ .Values.postgres.port }}
endpoints:
  - addresses: [{{ .Values.hostAddress | quote }}]
