image:
  registry: ghcr.io/lucasgroves0102
  # Commit SHA built by CI (required).
  tag: ""
  pullPolicy: IfNotPresent
  pullSecret: ghcr

# Created outside the chart. Keys: database-url, app-database-url, jwt-secret,
# anthropic-api-key, sec-user-agent, and openfga-api-token when openfga.auth.enabled.
secretName: tributary

# The node as seen from pods (k3s bridge). Postgres runs on the host; kubelet probes come from here.
hostAddress: 10.42.0.1

postgres:
  port: 5432

kafka:
  namespace: platform
  bootstrap: kafka.platform.svc.cluster.local:9092
  port: 9092

openfga:
  namespace: platform
  url: http://openfga.platform.svc.cluster.local:8080
  port: 8080
  # Send secretName's openfga-api-token as FGA_API_TOKEN (OpenFGA preshared-key auth).
  auth:
    enabled: false

# Sign-in as alice, bob, carol or dave without a password, and seed them on every deploy.
demo:
  enabled: true
  users: alice,bob,carol,dave

logLevel: INFO

# Prometheus (deploy/helm/monitoring) scrapes /metrics from each service through a PodMonitor:
# on `port` for HTTP services, on `metrics.port` for workers. `metrics: false` opts a service out.
metrics:
  enabled: true
  port: 9100
  # Only Prometheus pods in this namespace may connect to the metrics port.
  namespace: monitoring
  podLabels:
    app.kubernetes.io/name: prometheus

# CronJob schedules are in this zone (EDGAR's daily index lands late evening ET).
timeZone: America/New_York

resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    memory: 256Mi

# tmpSize: size limit of the /tmp emptyDir (default 64Mi; the root filesystem is read-only).
# databaseUrlKey: secretName key for DATABASE_URL instead of database-url (e.g. a throwaway DB).
# uses: postgres, kafka, openfga, sec (SEC_USER_AGENT + HTTPS out), anthropic (API key + HTTPS
# out), jwt, query-api, demo. Each adds the env vars and network access it needs.
# from: components allowed to connect on `port`; fromNamespaces: any pod in these namespaces.
services:
  poller:
    uses: [kafka, sec]
    env:
      POLL_INTERVAL_SECONDS: "30"
  bronze-loader:
    uses: [kafka, postgres]
  doc-fetcher:
    uses: [kafka, postgres, sec]
  parser:
    uses: [kafka, postgres]
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        memory: 768Mi
  authz-sync:
    uses: [kafka, postgres, openfga]
  query-api:
    port: 8000
    uses: [postgres, openfga, jwt, demo]
    from: [web, agent-api]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi
  agent-api:
    image: agent
    port: 8001
    uses: [anthropic, query-api]
    from: [web]
    env:
      AGENT_MODEL: claude-haiku-5-5
      AGENT_RATE_PER_HOUR: "30"
      AGENT_IP_RATE_PER_HOUR: "10"
      AGENT_DAILY_BUDGET_USD: "2"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi
  web:
    port: 8080
    probePath: /
    metrics: false
    fromNamespaces: [cloudflared]
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi

# Staggered so at most one SEC batch job runs at a time.
jobs:
  backfill:
    image: poller
    command: [poller-backfill, --days, "2"]
    schedule: "0 2 * * *"
    uses: [kafka, sec]
  companies:
    image: company-loader
    schedule: "0 3 * * *"
    uses: [postgres, sec]
  financials:
    image: facts-fetcher
    schedule: "0 4 * * *"
    uses: [postgres, sec]
  # Every SEC filer's XBRL facts from the nightly companyfacts.zip (one ~1.4 GB download per
  # night). A run loads batches of BULK_LIMIT changed companies with a pause between batches,
  # saving progress after each; the next night resumes where it stopped. Once caught up, a night
  # only touches the companies that changed and finishes in one batch.
  # Ships suspended. First run against a throwaway DB: set databaseUrlKey, then
  # kubectl create job --from=cronjob/financials-bulk financials-bulk-1
  financials-bulk:
    image: facts-fetcher
    command: [facts-fetcher-bulk]
    schedule: "0 5 * * *"
    suspend: true
    timeoutSeconds: 10800
    uses: [postgres, sec]
    tmpSize: 2Gi
    env:
      BULK_LIMIT: "500"
      BULK_ROUNDS: "12"
      BULK_PAUSE_SECONDS: "600"
  # Filing history and company metadata for every SEC filer from the bulk submissions.zip
  # (~1.6 GB, downloaded to /tmp; skipped when unchanged since the last finished load). A run
  # loads batches of --max-ciks changed CIKs with a pause between batches, committing as it
  # goes; the next night resumes where it stopped (the first load is ~1M CIKs).
  # Run now: kubectl create job --from=cronjob/submissions submissions-1. Set
  # env.SUBMISSIONS_DBNAME to load a throwaway database on the same server instead.
  submissions:
    image: company-loader
    command: [company-loader-submissions, --max-ciks, "20000", --rounds, "10",
              --pause-seconds, "600"]
    schedule: "30 5 * * *"
    suspend: true
    timeoutSeconds: 14400
    tmpSize: 3Gi
    uses: [postgres, sec]
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
  # Run once to fill a new database: kubectl create job --from=cronjob/seed-documents seed-1
  seed-documents:
    image: doc-fetcher
    command: [doc-fetcher-seed]
    schedule: "0 0 1 1 *"
    suspend: true
    uses: [kafka, postgres, sec]
