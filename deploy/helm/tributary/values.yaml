image:
  registry: ghcr.io/lucasgroves0102
  # Commit SHA built by CI (required).
  tag: ""
  pullPolicy: IfNotPresent
  pullSecret: ghcr

# Created outside the chart. Keys: database-url, app-database-url, jwt-secret,
# anthropic-api-key, sec-user-agent, openfga-api-token when openfga.auth.enabled,
# github-client-id and github-client-secret (optional: without both, no GitHub sign-in),
# data-connections-key (optional: without it, no "Connect your data"; README),
# sec-limiter-database-url when secLimiter.dedicatedLogin, and when kafka.sasl.enabled
# kafka-password-<user> for each `uses: kafka` service and job (scripts/kafka-passwords.sh).
secretName: tributary

# `uses: sec` pods reach the shared SEC token bucket (libs/sec) through SEC_LIMITER_DATABASE_URL.
# false: the full database-url login. true: secretName's sec-limiter-database-url, a login in
# the sec_limiter group (migration 022) that can only run ops.sec_take_token /
# ops.sec_report_throttle; pods that don't also use postgres then get no database-url at all.
# Create the login and the key first (README, "SEC limiter login").
secLimiter:
  dedicatedLogin: false

# The node as seen from pods (k3s bridge). Postgres runs on the host; kubelet probes come from here.
hostAddress: 10.42.0.1

postgres:
  port: 5432

kafka:
  namespace: platform
  bootstrap: kafka.platform.svc.cluster.local:9092
  port: 9092
  # Phase B of the Kafka SASL rollout (README, "Kafka authentication"; the platform chart's
  # kafka.sasl.enabled first): every `uses: kafka` pod connects to `bootstrap` over SASL_PLAINTEXT
  # as its own SCRAM user (kafkaUser, default its name) with secretName's kafka-password-<user>.
  sasl:
    enabled: false
    bootstrap: kafka.platform.svc.cluster.local:9094
    port: 9094

openfga:
  namespace: platform
  url: http://openfga.platform.svc.cluster.local:8080
  port: 8080
  # Send secretName's openfga-api-token as FGA_API_TOKEN (OpenFGA preshared-key auth).
  auth:
    enabled: false

# enabled: sign-in as alice, bob, carol or dave without a password (tests, adversarial suite;
# the web app hides them behind a dev flag), seeded on every deploy.
# sandbox: the public "Try the demo" (query-api, query_api/sandbox.py): each visitor gets a
# temporary real user (plan pro, the 20 companies in sandbox.py DEMO_TICKERS) for ttlHours;
# the hourly demo-cleanup job deletes expired ones. Limits (README, "Demo sandboxes"):
#   createPerIpPerHour  sandboxes one client address may start per hour
#   maxLive             unexpired sandboxes at once; beyond it visitors are told it's full
#   agent.enabled       false: the assistant refuses demo sandboxes (the rest still works)
#   agent.questionsPerUserPerDay / questionsPerDay  assistant questions per sandbox and across
#                       all sandboxes per UTC day (kept in the app DB; caps Anthropic spend
#                       together with agent-api's AGENT_DAILY_BUDGET_USD)
demo:
  enabled: true
  users: alice,bob,carol,dave
  sandbox:
    enabled: true
    ttlHours: 24
    createPerIpPerHour: 3
    maxLive: 200
    agent:
      enabled: true
      questionsPerUserPerDay: 10
      questionsPerDay: 200

# "Sign in with GitHub" (query-api, `uses: github`; README, "GitHub sign-in"): a permanent
# account with the demo sandbox's access. On only once secretName has github-client-id and
# github-client-secret (an OAuth app's; both optional keys). redirectUri must be the OAuth
# app's "Authorization callback URL"; empty: GitHub uses the one registered on the app.
github:
  redirectUri: https://tributary.lucasgroves.dev/api/query/v1/auth/github/callback

logLevel: INFO

# Filing alerts by email (query_api/alert_email.py): off. allow-internet opens only 443, so SMTP
# needs this too: `enabled: true` adds allow-smtp, TCP `port` to public addresses for pods that
# `uses: email` (the alerts job). Turning email on = this, plus ALERT_SMTP_HOST / ALERT_SMTP_FROM
# (and ALERT_SMTP_PORT when not 587, the same number as `port`) in the alerts job's env and
# ALERT_SMTP_USER / ALERT_SMTP_PASSWORD from the secret.
alertEmail:
  enabled: false
  port: 587

# Prometheus (deploy/helm/monitoring) scrapes /metrics from each service through a PodMonitor:
# on `port` for HTTP services, on `metrics.port` for workers. `metrics: false` opts a service out.
metrics:
  enabled: true
  port: 9100
  # Only Prometheus pods in this namespace may connect to the metrics port.
  namespace: monitoring
  podLabels:
    app.kubernetes.io/name: prometheus

# CronJob schedules are in this zone (EDGAR's daily index lands late evening ET).
timeZone: America/New_York

resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    memory: 256Mi

# tmpSize: size limit of the /tmp emptyDir (default 64Mi; the root filesystem is read-only).
# databaseUrlKey: secretName key for DATABASE_URL instead of database-url (e.g. a throwaway DB).
# uses: postgres, app-postgres (APP_DATABASE_URL), kafka, openfga, sec (SEC_USER_AGENT + HTTPS
# out, and the shared SEC rate limit in host Postgres), anthropic (API key + HTTPS out), github
# (GitHub OAuth app keys, optional, + HTTPS out), market-data (data-connections-key, optional,
# + HTTPS out to users' market-data providers), webhooks (HTTPS out to users' alert webhooks;
# query_api/webhooks.py refuses private addresses), jwt, query-api, demo. Each adds the env vars
# and network access it needs.
# kafkaUser: the Kafka SCRAM user with kafka.sasl.enabled (default: the service/job name).
# secClass: priority in the shared SEC rate limit (SEC_CALLER_CLASS): live, batch or bulk.
# Defaults: live for services, batch for jobs. Lower classes leave tokens for higher ones.
# from: components allowed to connect on `port`; fromNamespaces: any pod in these namespaces.
# replicas: default 1; 0 ships a service stopped.
services:
  poller:
    uses: [kafka, sec]
    env:
      POLL_INTERVAL_SECONDS: "30"
  bronze-loader:
    uses: [kafka, postgres]
  # Live documents: every 10-K/10-Q/8-K of tracked companies, and every operating company's new
  # 10-K, 10-Q and material 8-K from the feed (FETCH_OPERATING, FETCH_8K_ITEMS; services/doc-fetcher
  # README), within minutes. SEC class live.
  doc-fetcher:
    uses: [kafka, postgres, sec]
  # image: parser-rs (Rust, live since 2026-10-20) or parser (the Python reference). Both consume
  # documents.fetched as group parser-python, write the same silver.filing_sections rows
  # (parser = rust | python) and expose the same metrics and logs, so rolling back is this one
  # value.
  parser:
    image: parser-rs
    uses: [kafka, postgres]
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        memory: 768Mi
  # Document backfill (doc-fetcher's doc-crawler, migration 020): 10-K, 10-Q and 8-K (+ EX-99.x)
  # of every company with gold financials, last CRAWL_YEARS years, tracked companies first, then
  # most recent first. SEC class bulk, so it only gets tokens live and batch callers leave. A
  # long-running worker, not a CronJob: it runs for days, resumes from ops.doc_crawl_targets after
  # any restart, is scraped continuously for the stall/disk alerts, and once caught up queues new
  # filings every CRAWL_PLAN_HOURS. Pauses itself while the node has under CRAWL_MIN_FREE_GB free;
  # pause by hand with UPDATE ops.doc_crawl_control SET paused = true. Shipped stopped: start it and
  # parser-backfill with replicas: 1 in deploy/flux/releases/tributary.yaml (README), and keep both
  # running after the backfill: it takes what doc-fetcher leaves (amendments, daily-index filings,
  # 8-Ks outside doc-fetcher's items, fetch errors).
  doc-crawler:
    image: doc-fetcher
    command: [doc-crawler]
    replicas: 0
    uses: [kafka, postgres, sec]
    secClass: bulk
    terminationGracePeriodSeconds: 60
    env:
      # 11 years reaches November 2015: the pre-2021 document backfill from 2016 (Lucas, 2026-11-09; doc-fetcher
      # README "Documents before 2021": ~288k filings, ~+53 GB, ~29 h at the spare rate, then search indexing).
      # CRAWL_SINCE (a fixed start that can only reach further back) is left unset: the rolling 11 years already
      # covers 2016, and the crawl planned from November 2015 on 2026-11-09.
      CRAWL_YEARS: "11"
      # results, Reg FD and other events, plus the material events the company page lists since the last
      # report (deals, debt, leadership, impairments, auditor, non-reliance): ~65k more 8-Ks over 5 years
      CRAWL_8K_ITEMS: "1.01,1.02,1.03,1.05,2.01,2.02,2.03,2.04,2.05,2.06,3.01,3.02,3.03,4.01,4.02,5.01,5.02,5.03,7.01,8.01"
      CRAWL_MIN_FREE_GB: "50"
      CRAWL_WORKERS: "4"
      CRAWL_BATCH: "32"
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  # The parser for the crawl's documents.backfill topic, as its own group: the live parser only
  # reads documents.fetched, so a backlog of crawled documents (or a document that stops this
  # consumer) never delays new filings. Same image switch as parser.
  parser-backfill:
    image: parser-rs
    replicas: 0
    uses: [kafka, postgres]
    env:
      PARSER_TOPIC: documents.backfill
      PARSER_GROUP: parser-backfill
    resources:
      requests:
        cpu: 100m
        memory: 192Mi
      limits:
        memory: 768Mi
  authz-sync:
    uses: [kafka, postgres, openfga]
  query-api:
    port: 8000
    # webhooks: the alert settings' "Send a test" (query_api/alerts.py, 5 an hour per user)
    uses: [postgres, app-postgres, openfga, jwt, demo, github, market-data, webhooks]
    from: [web, agent-api]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi
  agent-api:
    image: agent
    port: 8001
    uses: [anthropic, query-api]
    from: [web]
    env:
      AGENT_MODEL: claude-haiku-5-5
      AGENT_RATE_PER_HOUR: "30"
      AGENT_IP_RATE_PER_HOUR: "10"
      AGENT_DAILY_BUDGET_USD: "2"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 384Mi
  web:
    port: 8080
    probePath: /
    metrics: false
    fromNamespaces: [cloudflared]
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        memory: 64Mi

# Every SEC caller shares one token bucket in Postgres (libs/sec, migration 019), so overlapping
# jobs can't exceed the SEC's 10 req/s; they're still staggered so they don't slow each other.
jobs:
  # Completeness check (poller-backfill, migration 027): compares the last 30 days of EDGAR's daily
  # master indexes with bronze, republishes only the missing filings to filings.raw and records
  # each day in ops.filing_completeness. postgres = the lookup and the record.
  backfill:
    image: poller
    command: [poller-backfill, --days, "30"]
    schedule: "0 2 * * *"
    uses: [kafka, sec, postgres]
    kafkaUser: poller-backfill
  companies:
    image: company-loader
    schedule: "0 3 * * *"
    uses: [postgres, sec]
  financials:
    image: facts-fetcher
    schedule: "0 4 * * *"
    uses: [postgres, sec]
  # Re-derive silver and gold from stored bronze, after a change to silver.metric_tags or gold's rules.
  # No SEC requests. Ships suspended and never runs on its own. Run now:
  # kubectl -n tributary create job --from=cronjob/financials-rebuild financials-rebuild-1
  financials-rebuild:
    image: facts-fetcher
    command: [facts-fetcher, --rebuild]
    schedule: "0 6 1 1 *"
    suspend: true
    timeoutSeconds: 21600
    uses: [postgres]
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
  # Filings companyfacts lacks, read from their own XBRL (facts-fetcher-filings, migration 055):
  # 10-K/10-Qs at least 3 days old with no fact in silver (the stored document's extract, else the
  # filing's instance: two SEC requests), the stored documents of companies with their own tags or
  # member sums (NVIDIA's capex, Ford's and GM's debt), and filings companyfacts has since caught up
  # with (their own facts leave silver). Each batch refreshes its companies' gold. Ships suspended:
  # run the backfill once (services/facts-fetcher README, "Filings companyfacts lacks"), then set
  # suspend: false in the Flux release for the daily run.
  filing-facts:
    image: facts-fetcher
    command: [facts-fetcher-filings]
    schedule: "30 9 * * *"
    suspend: true
    timeoutSeconds: 7200
    uses: [postgres, sec]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  # Every SEC filer's XBRL facts from the nightly companyfacts.zip (one ~1.4 GB download per
  # night). A run loads batches of BULK_LIMIT changed companies back to back, saving progress
  # after each; a stopped run resumes where it left off. Once caught up, a night only touches the
  # companies that changed and finishes in one batch.
  # Run now: kubectl create job --from=cronjob/financials-bulk financials-bulk-1. Set
  # databaseUrlKey to load a throwaway database instead.
  financials-bulk:
    image: facts-fetcher
    command: [facts-fetcher-bulk]
    schedule: "0 5 * * *"
    timeoutSeconds: 14400
    uses: [postgres, sec]
    tmpSize: 2Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
    env:
      BULK_LIMIT: "500"
      BULK_ROUNDS: "60"
      BULK_PAUSE_SECONDS: "0"
  # Filing history and company metadata for every SEC filer from the bulk submissions.zip
  # (~1.6 GB, downloaded to /tmp; skipped when unchanged since the last finished load). A run
  # loads batches of --max-ciks changed CIKs back to back, committing as it goes; a stopped run
  # resumes where it left off (the first load is ~1M CIKs).
  # Run now: kubectl create job --from=cronjob/submissions submissions-1. Set
  # env.SUBMISSIONS_DBNAME to load a throwaway database on the same server instead.
  submissions:
    image: company-loader
    command: [company-loader-submissions, --max-ciks, "20000", --rounds, "60"]
    schedule: "30 5 * * *"
    timeoutSeconds: 28800
    tmpSize: 3Gi
    uses: [postgres, sec]
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
  # Insider filings (#117, migration 054): the Forms 3/4/5 of operating companies filed in the last
  # INSIDERS_DAYS days that bronze.ownership_documents doesn't have, newest first, one SEC request
  # each at the bulk class, stored and parsed into silver. The live doc-fetcher stores new ones from
  # the feed. Run once after the deploy: kubectl create job --from=cronjob/insiders-backfill ins-1
  # (~179,000 filings a year: 90 days is ~45,000 requests, about 2 h when the bulk class is idle,
  # up to ~15 h while the document crawl takes most of it). A run cut off at the deadline loses
  # nothing: the next one takes only what is still missing.
  insiders-backfill:
    image: doc-fetcher
    command: [doc-fetcher-insiders]
    schedule: "0 0 1 1 *"
    suspend: true
    timeoutSeconds: 61200
    uses: [postgres, sec]
    secClass: bulk
    env:
      INSIDERS_DAYS: "90"
      INSIDERS_LIMIT: "60000"
  # The daily catch-up: the same job over the last 7 days, after the nightly submissions load
  # (05:30), for insider filings the live feed missed (a doc-fetcher outage, a feed gap). Filings
  # kept as failed in ops.insider_queue (gone, no XML, refused) are never fetched again. Usually a
  # handful of requests; a week of total outage is ~3,500 (~10 min at the bulk class).
  insiders-catchup:
    image: doc-fetcher
    command: [doc-fetcher-insiders]
    schedule: "45 8 * * *"
    timeoutSeconds: 7200
    uses: [postgres, sec]
    secClass: bulk
    env:
      INSIDERS_DAYS: "7"
      INSIDERS_LIMIT: "5000"
  # Run once to fill a new database: kubectl create job --from=cronjob/seed-documents seed-1
  seed-documents:
    image: doc-fetcher
    command: [doc-fetcher-seed]
    schedule: "0 0 1 1 *"
    suspend: true
    uses: [kafka, postgres, sec]
    kafkaUser: doc-fetcher-seed
    secClass: bulk
  # Segment and KPI facts (facts-fetcher-segments, migration 018): parses the inline XBRL of the
  # 10-K/10-Q documents already in bronze.filing_documents (stored by doc-fetcher and the document
  # crawl), so it makes no SEC requests. A run extracts up to SEGMENTS_LIMIT pending documents in
  # transactions of SEGMENTS_BATCH, each with its silver and gold rows and the segment quality
  # check; the per-document extract (content hash + extractor version) is the checkpoint, so a
  # stopped run resumes where it left off. Documents are decompressed and parsed in 1 MB chunks.
  # Hourly once enabled, to pick up new filings. Ships suspended; first load (~90k documents
  # once the crawl is done): kubectl -n tributary create job --from=cronjob/segments segments-1
  segments:
    image: facts-fetcher
    command: [facts-fetcher-segments]
    schedule: "20 * * * *"
    suspend: true
    timeoutSeconds: 14400
    uses: [postgres]
    tmpSize: 256Mi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi
    env:
      SEGMENTS_LIMIT: "2000"
      SEGMENTS_BATCH: "25"
      SEGMENTS_ROUNDS: "40"
      SEGMENTS_PAUSE_SECONDS: "0"
  # Filing alerts (query_api/alert_job.py, app migration 016): every 10 minutes, the 10-K, 10-Q
  # and material 8-K filings of each user's watched and analysed companies in the last 3 days
  # (public filing index), as in-app notifications with their key figures and the user's red
  # lines (read as that user: OpenFGA, then RLS), sent on to users' webhooks with retries.
  # Idempotent on the filing, so a missed or repeated run loses or doubles nothing. postgres +
  # app-postgres + openfga = the reads; jwt = webhook signing secrets (derived, never stored);
  # webhooks = HTTPS out to public addresses only. No Kafka client, no SEC requests.
  alerts:
    image: query-api
    command: [query-api-alerts]
    schedule: "*/10 * * * *"
    timeoutSeconds: 540
    # email: SMTP out, only once alertEmail.enabled (off: the label opens nothing)
    uses: [postgres, app-postgres, openfga, jwt, webhooks, email]
    env:
      PUBLIC_APP_URL: https://tributary.lucasgroves.dev
  # Deletes demo sandbox users past their expiry (query_api/sandbox.py). The deletion reaches
  # OpenFGA and authz.user_access through CDC like any user's; watchlists and usage go too.
  demo-cleanup:
    image: query-api
    command: [query-api-demo-cleanup]
    schedule: "15 * * * *"
    timeoutSeconds: 600
    uses: [app-postgres]
  # Search passages and section diffs (parser-index, migration 021): indexes parsed sections for
  # full-text search and compares Risk Factors / MD&A of each 10-K and 10-Q with the comparable
  # earlier filing. No SEC requests. A run processes up to SECTION_INDEX_LIMIT pending filings in
  # transactions of SECTION_INDEX_BATCH; ops.section_index is the checkpoint, so a stopped run
  # resumes where it left off and a filing whose prior arrives later is re-diffed. Hourly once
  # enabled. Ships suspended; first load after the crawl (~265k filings, about 1 h of
  # to_tsvector plus ~4 h of diffs): kubectl -n tributary create job
  # --from=cronjob/section-index section-index-1, repeated until ops.section_index_status
  # catches up; then REINDEX the GIN index (gold.section_search_tsv), bloated by the bulk load.
  section-index:
    image: parser  # Python: the indexing job (filing_parser/index.py), not the document parser
    command: [parser-index]
    schedule: "40 * * * *"
    suspend: true
    timeoutSeconds: 14400
    uses: [postgres]
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 768Mi
    env:
      SECTION_INDEX_LIMIT: "20000"
      SECTION_INDEX_BATCH: "25"
  # Peers by business (parser-peers, migration 047): reads each company's latest 10-K Item 1
  # twice (~250 MB of text, ~6 s each on hermes), compares them as term vectors and replaces
  # gold.business_profiles / business_peers / business_mentions in one transaction (60 MB). No
  # SEC requests. 79 s and 406 MB peak on hermes' 4,888 usable Item 1s of 2026-11-09. Weekly:
  # a new 10-K changes one company's vector; until the first run the Query API ranks peers by SIC
  # and size. First run after the deploy: kubectl -n tributary create job
  # --from=cronjob/business-peers business-peers-1 (docs/analyst-test/b6-runbook.md, F4).
  business-peers:
    image: parser
    command: [parser-peers]
    schedule: "30 5 * * 0"
    timeoutSeconds: 3600
    uses: [postgres]
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
