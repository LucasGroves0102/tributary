# Shared tooling config. Each service has its own pyproject.toml for dependencies.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["poller", "bronze_loader", "company_loader", "doc_fetcher", "facts_fetcher", "filing_parser", "authz_sync", "query_api", "tributary_agent", "adversarial_harness", "adversarial_cases", "citation_cases", "tributary_authz", "tributary_sec"]

[tool.pytest.ini_options]
testpaths = ["libs", "services", "tests"]
addopts = "--import-mode=importlib"

[tool.pyright]
include = ["libs/sec/src", "libs/authz/src", "services/*/src", "deploy/platform-setup"]
exclude = ["**/node_modules", "services/web"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.coverage.run]
source = ["libs", "services"]
omit = ["*/tests/*", "services/web/*"]

[tool.coverage.report]
fail_under = 80
skip_covered = true
