# Shared tooling config. Each service has its own pyproject.toml for dependencies.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["poller", "bronze_loader", "company_loader", "tributary_sec"]

[tool.pytest.ini_options]
testpaths = ["libs", "services", "tests"]
addopts = "--import-mode=importlib"
