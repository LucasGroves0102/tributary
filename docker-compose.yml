services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "wal_level=logical"]  # Debezium CDC (FR7)
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"  # 5433 on the host avoids clashing with a local Postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tributary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tributary}
      POSTGRES_DB: ${POSTGRES_DB:-tributary}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FR7 CDC: Kafka Connect with Debezium. Register the connector with `make cdc`.
  connect:
    image: quay.io/debezium/connect:2.7.3.Final
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: connect
      CONFIG_STORAGE_TOPIC: connect.configs
      OFFSET_STORAGE_TOPIC: connect.offsets
      STATUS_STORAGE_TOPIC: connect.statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # FR8 authorization. Started by `make up` after its database is migrated.
  openfga:
    image: openfga/openfga:v1.8.4
    command: run
    profiles: ["authz"]
    ports:
      - "127.0.0.1:8081:8080"  # HTTP API; 8080 on the host is kafka-ui
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-tributary}:${POSTGRES_PASSWORD:-tributary}@postgres:5432/openfga?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  openfga-migrate:
    image: openfga/openfga:v1.8.4
    command: migrate
    profiles: ["tools"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-tributary}:${POSTGRES_PASSWORD:-tributary}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # OpenFGA CLI: make authz, make authz-test
  fga:
    image: openfga/cli:v0.6.3
    profiles: ["tools"]
    working_dir: /authz
    volumes:
      - ./authz:/authz:ro
    environment:
      FGA_API_URL: http://openfga:8080

  # Dev UI: browse topics and messages at http://localhost:8080
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.0.0
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tributary
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # Started with `make up-all` once the poller is written
  poller:
    build:
      context: .
      dockerfile: services/poller/Dockerfile
    profiles: ["app"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  bronze-loader:
    build: ./services/bronze-loader
    profiles: ["app"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql://${POSTGRES_USER:-tributary}:${POSTGRES_PASSWORD:-tributary}@postgres:5432/${POSTGRES_DB:-tributary}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  doc-fetcher:
    build:
      context: .
      dockerfile: services/doc-fetcher/Dockerfile
    profiles: ["app"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql://${POSTGRES_USER:-tributary}:${POSTGRES_PASSWORD:-tributary}@postgres:5432/${POSTGRES_DB:-tributary}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  parser:
    build:
      context: .
      dockerfile: services/parser/Dockerfile
    profiles: ["app"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql://${POSTGRES_USER:-tributary}:${POSTGRES_PASSWORD:-tributary}@postgres:5432/${POSTGRES_DB:-tributary}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  authz-sync:
    build:
      context: .
      dockerfile: services/authz-sync/Dockerfile
    profiles: ["app"]
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql://${POSTGRES_USER:-tributary}:${POSTGRES_PASSWORD:-tributary}@postgres:5432/${POSTGRES_DB:-tributary}
      FGA_API_URL: http://openfga:8080
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  query-api:
    build:
      context: .
      dockerfile: services/query-api/Dockerfile
    profiles: ["app"]
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tributary}:${POSTGRES_PASSWORD:-tributary}@postgres:5432/${POSTGRES_DB:-tributary}
      FGA_API_URL: http://openfga:8080
      DEMO_USERS: alice,bob,carol,dave
    depends_on:
      postgres:
        condition: service_healthy

  agent-api:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    profiles: ["app"]
    ports:
      - "127.0.0.1:8001:8001"
    env_file: .env
    environment:
      QUERY_API_URL: http://query-api:8000
    depends_on:
      - query-api

  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    profiles: ["app"]
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      - query-api
      - agent-api

  # Batch job: make companies
  company-loader:
    build:
      context: .
      dockerfile: services/company-loader/Dockerfile
    profiles: ["jobs"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tributary}:${POSTGRES_PASSWORD:-tributary}@postgres:5432/${POSTGRES_DB:-tributary}
    depends_on:
      postgres:
        condition: service_healthy

  # Batch job: make financials
  facts-fetcher:
    build:
      context: .
      dockerfile: services/facts-fetcher/Dockerfile
    profiles: ["jobs"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tributary}:${POSTGRES_PASSWORD:-tributary}@postgres:5432/${POSTGRES_DB:-tributary}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
