# The stack for tests/propagation and tests/kafka_acls in CI (ci.yml, job propagation): Kafka
# (KRaft, SASL/SCRAM + ACLs), Postgres with wal_level=logical, Kafka Connect + Debezium and
# OpenFGA, pinned to the digests hermes runs (deploy/helm/platform/values.yaml; Postgres as in
# the python job). Service names match
# streaming/debezium/app-connector.json (database.hostname: postgres). Host ports are the local
# stack's (docker-compose.yml), so the same .env-style URLs work.
services:
  # Kafka as on hermes with every SASL flag on (deploy/helm/platform kafka.sasl.enabled,
  # kafka.sasl.connect, kafka.plaintextListener=false): SASL_PLAINTEXT + SCRAM-SHA-512 for every
  # client (SASL for Connect, EXTERNAL for the runner), StandardAuthorizer denying anything
  # without an ACL, PLAINTEXT only on localhost inside the container (BROKER, CONTROLLER).
  # kafka-scram-admin creates the admin user there; the job then runs setup.py kafka.
  kafka:
    image: apache/kafka:3.8.0@sha256:c89f315cff967322c5d2021434b32271393cb193aa7ec1d43e97341924e57069
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: SASL://:29092,EXTERNAL://:9092,BROKER://localhost:9095,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: SASL://kafka:29092,EXTERNAL://localhost:9092,BROKER://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL:SASL_PLAINTEXT,EXTERNAL:SASL_PLAINTEXT,BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-512
      KAFKA_LISTENER_NAME_SASL_SCRAM___SHA___512_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.scram.ScramLoginModule required;"
      KAFKA_LISTENER_NAME_EXTERNAL_SCRAM___SHA___512_SASL_JAAS_CONFIG: "org.apache.kafka.common.security.scram.ScramLoginModule required;"
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: "User:ANONYMOUS;User:admin"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9095 --list"]
      interval: 3s
      timeout: 10s
      retries: 40

  # The Kafka pod's scram-admin container (deploy/helm/platform), sharing the broker's network.
  kafka-scram-admin:
    image: apache/kafka:3.8.0@sha256:c89f315cff967322c5d2021434b32271393cb193aa7ec1d43e97341924e57069
    network_mode: "service:kafka"
    entrypoint: ["sh", "/kafka-admin.sh"]
    environment:
      KAFKA_HEAP_OPTS: "-Xmx64m -Xms32m"
      INTERVAL: 2
    volumes:
      - ../../deploy/helm/platform/files/kafka-admin.sh:/kafka-admin.sh:ro
      - ${KAFKA_PASSWORDS_DIR:?run with KAFKA_PASSWORDS_DIR (kafka-password-<user> files)}:/secrets:ro
    depends_on:
      kafka:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: tributary
      POSTGRES_PASSWORD: tributary
      POSTGRES_DB: tributary
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tributary -h localhost"]
      interval: 2s
      timeout: 5s
      retries: 30

  connect:
    image: quay.io/debezium/connect:2.7.3.Final@sha256:a51bbb3a08d0de2cd56f76b956060bdaa3beb112ec13dac2668886b92dd5dd0b
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      # As the platform chart with kafka.sasl.connect (worker, producer. and consumer. clients)
      CONNECT_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_SASL_MECHANISM: SCRAM-SHA-512
      CONNECT_SASL_JAAS_CONFIG: &connect-jaas 'org.apache.kafka.common.security.scram.ScramLoginModule required username="connect" password="${KAFKA_PASSWORD_CONNECT:?}";'
      CONNECT_PRODUCER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_PRODUCER_SASL_MECHANISM: SCRAM-SHA-512
      CONNECT_PRODUCER_SASL_JAAS_CONFIG: *connect-jaas
      CONNECT_CONSUMER_SECURITY_PROTOCOL: SASL_PLAINTEXT
      CONNECT_CONSUMER_SASL_MECHANISM: SCRAM-SHA-512
      CONNECT_CONSUMER_SASL_JAAS_CONFIG: *connect-jaas
      GROUP_ID: connect
      CONFIG_STORAGE_TOPIC: connect.configs
      OFFSET_STORAGE_TOPIC: connect.offsets
      STATUS_STORAGE_TOPIC: connect.statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  openfga-migrate:
    image: openfga/openfga:v1.8.4@sha256:0ad225772d28527eacbe71fda9f2349b332100a710c2f2a624b188470b38f1ac
    command: migrate
    profiles: ["tools"]
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://tributary:tributary@postgres:5432/openfga?sslmode=disable

  openfga:
    image: openfga/openfga:v1.8.4@sha256:0ad225772d28527eacbe71fda9f2349b332100a710c2f2a624b188470b38f1ac
    command: run
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://tributary:tributary@postgres:5432/openfga?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: "false"

  # OpenFGA CLI for scripts/authz-bootstrap.sh (FGA_CLI below)
  fga:
    image: openfga/cli:v0.6.3@sha256:4f3bf5ec0e79e20eb6e400f98431d23eda259faf71dfaf72b2f196d7823a3ef9
    profiles: ["tools"]
    working_dir: /authz
    volumes:
      - ../../authz:/authz:ro
    environment:
      FGA_API_URL: http://openfga:8080
