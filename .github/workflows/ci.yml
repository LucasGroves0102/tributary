name: CI
on: [push, pull_request]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan every commit, not just the latest
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1 git --redact --no-banner .

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tributary
          POSTGRES_PASSWORD: tributary
          POSTGRES_DB: tributary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tributary"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tributary:tributary@localhost:5432/tributary
      TEST_DATABASE_URL: postgresql://tributary:tributary@localhost:5432/tributary
      APP_DATABASE_URL: postgresql://tributary:tributary@localhost:5432/app
      APP_TEST_DATABASE_URL: postgresql://tributary:tributary@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest pytest-cov pyright -e libs/sec -e libs/authz -e services/poller -e services/bronze-loader -e services/company-loader -e services/facts-fetcher -e services/doc-fetcher -e services/parser -e services/authz-sync -e 'services/query-api[test]' -e services/agent
      - run: ruff check .
      - run: pyright --pythonpath "$(which python)"
      - run: ./scripts/create-databases.sh
      - run: ./scripts/migrate.sh db/migrations "$DATABASE_URL"
      - run: ./scripts/migrate.sh db/app/migrations "$APP_DATABASE_URL"
      - run: pytest --cov --cov-report=term
      - if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  authz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenFGA model tests
        run: >-
          docker run --rm -v "$PWD/authz:/authz:ro" -w /authz
          openfga/cli:v0.6.3 model test --tests model.fga.yaml

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: helm lint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0
          lint --strict deploy/helm/tributary --set image.tag=ci
      - name: kubeconform
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0
          template tributary deploy/helm/tributary --namespace tributary --set image.tag=ci
          | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0
          -strict -summary -kubernetes-version 1.36.0 -

  images:
    name: image ${{ matrix.service }}
    needs: [secrets, python, web, authz, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [agent, authz-sync, company-loader, doc-fetcher, facts-fetcher, parser,
                  poller, query-api, web]
        context: [.]
        include:
          - service: bronze-loader
            context: services/bronze-loader
          - service: migrate
            context: .
            file: db/Dockerfile
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tributary-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('services/{0}/Dockerfile', matrix.service) }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
