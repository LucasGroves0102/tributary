name: CI
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tributary
          POSTGRES_PASSWORD: tributary
          POSTGRES_DB: tributary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tributary"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tributary:tributary@localhost:5432/tributary
      TEST_DATABASE_URL: postgresql://tributary:tributary@localhost:5432/tributary
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest -e libs/sec -e services/poller -e services/bronze-loader -e services/company-loader -e services/facts-fetcher
      - run: ruff check .
      - run: ./scripts/migrate.sh
      - run: pytest
