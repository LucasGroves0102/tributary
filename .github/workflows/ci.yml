name: CI
on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # scan every commit, not just the latest
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner .
      - name: deploy/secrets encrypted with sops
        run: pip install pyyaml==6.0.3 && python scripts/check-secrets-encrypted.py

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: tributary
          POSTGRES_PASSWORD: tributary
          POSTGRES_DB: tributary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tributary"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tributary:tributary@localhost:5432/tributary
      TEST_DATABASE_URL: postgresql://tributary:tributary@localhost:5432/tributary
      APP_DATABASE_URL: postgresql://tributary:tributary@localhost:5432/app
      APP_TEST_DATABASE_URL: postgresql://tributary:tributary@localhost:5432/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff pytest pytest-cov pyright pyyaml==6.0.3 -e libs/kafka -e libs/telemetry -e libs/sec -e libs/authz -e services/poller -e services/bronze-loader -e services/company-loader -e services/facts-fetcher -e services/doc-fetcher -e services/parser -e services/authz-sync -e 'services/query-api[test]' -e services/agent
      - run: ruff check .
      - run: pyright --pythonpath "$(which python)"
      - run: ./scripts/create-databases.sh
      # Migrate as hermes does: a login that owns the databases but is neither superuser nor
      # CREATEROLE, with the group roles the owner creates on the host already in place.
      - name: Production-like migration login
        run: |
          psql "postgresql://tributary:tributary@localhost:5432/postgres" -v ON_ERROR_STOP=1 -q <<'SQL'
          CREATE ROLE migrator LOGIN PASSWORD 'migrator' REPLICATION;
          CREATE ROLE query_api NOLOGIN;
          CREATE ROLE ops_reader NOLOGIN;
          CREATE ROLE sec_limiter NOLOGIN;
          GRANT query_api TO migrator;
          ALTER DATABASE tributary OWNER TO migrator;
          ALTER DATABASE app OWNER TO migrator;
          SQL
      - run: ./scripts/migrate.sh db/migrations "postgresql://migrator:migrator@localhost:5432/tributary"
      - run: ./scripts/migrate.sh db/app/migrations "postgresql://migrator:migrator@localhost:5432/app"
      - name: Rust parser service, for the parser equivalence test
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --locked --bin parser --manifest-path services/parser-rs/Cargo.toml
          echo "PARSER_RS_BIN=$PWD/services/parser-rs/target/debug/parser" >> "$GITHUB_ENV"
      - name: TLS-only Postgres, for the Rust parser's sslmode test (test_rust_tls.py)
        run: |
          d="$RUNNER_TEMP/pgtls" && mkdir -p "$d" && cd "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=tributary-test-ca -keyout ca.key -out ca.pem
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=unrelated-ca -keyout other.key -out other.pem
          openssl req -newkey rsa:2048 -nodes -subj /CN=localhost -keyout server.key -out server.csr
          printf 'subjectAltName=DNS:localhost\n' > ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 1 -extfile ext -out server.pem
          sudo chown 999:999 server.key server.pem && sudo chmod 600 server.key  # postgres uid in the image
          docker run -d --name pgtls -p 5434:5432 -e POSTGRES_PASSWORD=tls \
            -v "$d:/tls:ro" -v "$GITHUB_WORKSPACE/.github/ci/pg_hba_tls.conf:/etc/pg_hba_tls.conf:ro" \
            pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a \
            -c ssl=on -c ssl_cert_file=/tls/server.pem -c ssl_key_file=/tls/server.key \
            -c hba_file=/etc/pg_hba_tls.conf
          for i in $(seq 60); do
            PGPASSWORD=tls PGSSLMODE=require psql -h localhost -p 5434 -U postgres -c 'select 1' >/dev/null 2>&1 && break
            [ "$i" = 60 ] && { docker logs pgtls; exit 1; }
            sleep 1
          done
          echo "TLS_TEST_DATABASE_URL=postgresql://postgres:tls@localhost:5434/postgres" >> "$GITHUB_ENV"
          echo "TLS_TEST_ROOT_CERT=$d/ca.pem" >> "$GITHUB_ENV"
          echo "TLS_TEST_OTHER_CA=$d/other.pem" >> "$GITHUB_ENV"
      - run: pytest --cov --cov-report=term
      - if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  propagation:
    # tests/propagation against the full access pipeline: app DB → Debezium → Kafka →
    # authz-sync → OpenFGA + authz.user_access, with the BRD's < 30 s timing assertions. Kafka
    # runs with SASL/SCRAM + ACLs as on hermes with every kafka.sasl flag on, so Connect and
    # authz-sync use their own logins; tests/kafka_acls then checks every principal's ACLs.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE: docker compose -f tests/propagation/compose.ci.yml
      POSTGRES_USER: tributary
      POSTGRES_PASSWORD: tributary
      DATABASE_URL: postgresql://tributary:tributary@localhost:5433/tributary
      APP_DATABASE_URL: postgresql://tributary:tributary@localhost:5433/app
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      CONNECT_URL: http://localhost:8083
      FGA_API_URL: http://localhost:8081
      METRICS_PORT: "9108"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Kafka passwords (throwaway; one per principal in kafka-acls.yaml, plus admin)
        run: |
          d="$RUNNER_TEMP/kafka-passwords" && mkdir -p "$d"
          for u in admin $(sed -n 's/^  \([a-z-]*\):.*/\1/p' deploy/helm/platform/files/kafka-acls.yaml); do
            openssl rand -hex 32 > "$d/kafka-password-$u"
          done
          chmod 755 "$d" && chmod 644 "$d"/*  # read by the Kafka image's uid
          echo "KAFKA_PASSWORDS_DIR=$d" >> "$GITHUB_ENV"
          echo "KAFKA_PASSWORD_CONNECT=$(cat "$d/kafka-password-connect")" >> "$GITHUB_ENV"
          ls "$d"
      - name: Pull images and install authz-sync in parallel
        run: |
          $COMPOSE --profile tools pull --quiet &
          pip install pytest pyyaml==6.0.3 -e libs/kafka -e libs/telemetry -e libs/authz \
            -e services/authz-sync -e services/query-api  # test_sandbox.py: AppSandboxes
          wait $!
      - name: Kafka and Postgres
        run: $COMPOSE up -d --wait --wait-timeout 180 kafka kafka-scram-admin postgres
      - name: Kafka users and ACLs (setup.py kafka, as the setup-kafka hook)
        run: >-
          KAFKA_ACLS=deploy/helm/platform/files/kafka-acls.yaml
          timeout 300 python deploy/platform-setup/setup.py kafka
      - name: Databases, migrations, demo users
        run: |
          ./scripts/create-databases.sh
          ./scripts/migrate.sh db/migrations "$DATABASE_URL"
          ./scripts/migrate.sh db/app/migrations "$APP_DATABASE_URL"
          psql "$APP_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/app/seed.sql
      - name: OpenFGA and Kafka Connect
        run: |
          $COMPOSE --profile tools run --rm openfga-migrate
          $COMPOSE up -d --wait --wait-timeout 180 openfga connect
          for i in $(seq 90); do curl -sf "$FGA_API_URL/healthz" >/dev/null && break; [ "$i" = 90 ] && exit 1; sleep 1; done
          ./scripts/authz-bootstrap.sh
      - name: Debezium connector
        run: ./scripts/register-connector.sh
      - name: authz-sync, caught up with the demo users
        env:
          KAFKA_SECURITY_PROTOCOL: SASL_PLAINTEXT
          KAFKA_SASL_USERNAME: authz-sync
        run: |
          KAFKA_SASL_PASSWORD="$(cat "$KAFKA_PASSWORDS_DIR/kafka-password-authz-sync")" \
            nohup authz-sync > "$RUNNER_TEMP/authz-sync.log" 2>&1 &
          for i in $(seq 180); do
            curl -sf "localhost:$METRICS_PORT/metrics" | grep -q '^tributary_authz_caught_up 1' \
              && [ "$(psql "$DATABASE_URL" -qAtc "SELECT count(*) FROM authz.user_access WHERE user_id = 'alice'")" -gt 0 ] \
              && { echo "caught up after ${i}s"; exit 0; }
            sleep 1
          done
          echo "authz-sync did not catch up" >&2; exit 1
      - name: Propagation tests (revocation, downgrade, user deletion; < 30 s each, guard 3 s)
        env:
          PROPAGATION_REPEATS: "5"
          PROPAGATION_RESULTS: ${{ runner.temp }}/propagation.json
        run: E2E=1 pytest -q -s -p no:cacheprovider tests/propagation
      - name: Propagation timings in the job summary
        if: always()
        env:
          PROPAGATION_RESULTS: ${{ runner.temp }}/propagation.json
        run: |
          [ -f "$PROPAGATION_RESULTS" ] || exit 0
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os, statistics
          results = json.load(open(os.environ["PROPAGATION_RESULTS"]))
          print("### Propagation (app DB commit → OpenFGA and authz.user_access)\n")
          print("| Scenario | Runs | Median s | Max s | All s |")
          print("|---|---|---|---|---|")
          for name, xs in results.items():
              print(f"| {name} | {len(xs)} | {statistics.median(xs):.3f} | {max(xs):.3f} | "
                    + ", ".join(f"{x:.3f}" for x in xs) + " |")
          print("\n```json\n" + json.dumps(results) + "\n```")
          PY
      - name: Kafka ACLs (each principal only its own topics and groups; bad logins rejected)
        run: E2E=1 pytest -q -p no:cacheprovider --durations=5 tests/kafka_acls
      - name: Logs
        if: failure()
        run: |
          echo "::group::authz-sync"; cat "$RUNNER_TEMP/authz-sync.log" || true; echo "::endgroup::"
          echo "::group::connector status"; curl -s "$CONNECT_URL/connectors/app/status" || true; echo "::endgroup::"
          for s in kafka kafka-scram-admin postgres connect openfga; do
            echo "::group::$s"; $COMPOSE logs --no-color --tail 300 "$s"; echo "::endgroup::"
          done
      - if: always()
        run: $COMPOSE --profile tools down -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    # Playwright flows (services/web/e2e) against the built app, every API call mocked by
    # route interception: no backend, one worker, headless chromium.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('services/web/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: |
            services/web/playwright-report
            services/web/test-results
          retention-days: 7

  rust:
    runs-on: ubuntu-latest
    container: rust:1.99.1-slim-trixie@sha256:4df2ae8cfdfebdfc13a65da7f253b73d68983dc0339f2719bc17a279c913b13d
    defaults:
      run:
        working-directory: services/parser-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: apt-get update && apt-get install -y --no-install-recommends make g++ pkg-config libssl-dev  # librdkafka, native-tls
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  authz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: OpenFGA model tests
        run: >-
          docker run --rm -v "$PWD/authz:/authz:ro" -w /authz
          openfga/cli:v0.6.3@sha256:4f3bf5ec0e79e20eb6e400f98431d23eda259faf71dfaf72b2f196d7823a3ef9 model test --tests model.fga.yaml

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: helm lint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
          lint --strict deploy/helm/tributary --set image.tag=ci
      - name: kubeconform
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
          template tributary deploy/helm/tributary --namespace tributary --set image.tag=ci
          | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary -kubernetes-version 1.36.0 -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          -
      - name: SEC limiter login wiring (secLimiter.dedicatedLogin off and on)
        run: |
          pip install pyyaml==6.0.3
          for mode in off on; do
            flag=false; [ "$mode" = on ] && flag=true
            docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 \
              template tributary deploy/helm/tributary --namespace tributary --set image.tag=ci \
              --set secLimiter.dedicatedLogin=$flag \
              | python3 deploy/helm/tributary/tests/check_sec_limiter.py "$mode"
          done
      - name: Kafka SASL wiring (kafka.sasl.enabled off and on), kubeconform with it on
        run: |
          for mode in off on; do
            flag=false; [ "$mode" = on ] && flag=true
            docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 \
              template tributary deploy/helm/tributary --namespace tributary --set image.tag=ci \
              --set kafka.sasl.enabled=$flag > "tributary-sasl-$mode.yaml"
            python3 deploy/helm/tributary/tests/check_kafka_auth.py "$mode" < "tributary-sasl-$mode.yaml"
          done
          docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 lint --strict deploy/helm/tributary --set image.tag=ci --set kafka.sasl.enabled=true
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -summary -kubernetes-version 1.36.0 -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            - < tributary-sasl-on.yaml
      - name: helm lint (platform)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
          lint --strict deploy/helm/platform --set images.setup.tag=ci
      - name: kubeconform (platform)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
          template platform deploy/helm/platform --namespace platform --set images.setup.tag=ci
          | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary -kubernetes-version 1.36.0 -
      - name: platform with the Kafka SASL phases (A, A+B, A+B+C)
        run: |
          for phase in "kafka.sasl.enabled=true" \
                       "kafka.sasl.enabled=true,kafka.sasl.connect=true" \
                       "kafka.sasl.enabled=true,kafka.sasl.connect=true,kafka.plaintextListener=false"; do
            echo "== $phase"
            docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 lint --strict deploy/helm/platform --set images.setup.tag=ci --set "$phase"
            docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 template platform deploy/helm/platform --namespace platform --set images.setup.tag=ci --set "$phase" \
              | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c -strict -summary -kubernetes-version 1.36.0 -
          done
          # invalid combinations must fail to render
          for bad in "kafka.plaintextListener=false" "kafka.sasl.connect=true" \
                     "kafka.sasl.enabled=true,kafka.plaintextListener=false"; do
            if docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 template platform deploy/helm/platform --set images.setup.tag=ci --set "$bad" >/dev/null 2>&1; then
              echo "rendered with $bad" >&2; exit 1
            fi
          done

      - name: helm lint (monitoring)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 -c
          "helm repo add prometheus-community https://prometheus-community.github.io/helm-charts >/dev/null
          && helm repo add grafana https://grafana.github.io/helm-charts >/dev/null
          && helm dependency build deploy/helm/monitoring
          && helm lint --strict deploy/helm/monitoring
          && helm template monitoring deploy/helm/monitoring --namespace monitoring > monitoring.yaml
          && helm template monitoring deploy/helm/monitoring --namespace monitoring
          --set prometheus-kafka-exporter.sasl.enabled=true --set prometheus-kafka-exporter.sasl.scram.enabled=true
          --set 'prometheus-kafka-exporter.kafkaServer[0]=kafka.platform.svc.cluster.local:9094'
          > monitoring-sasl.yaml
          && grep -q -- --sasl.mechanism=scram-sha512 monitoring-sasl.yaml"
      - name: kubeconform (monitoring, kafka-exporter SASL off and on)
        run: >-
          cat monitoring.yaml monitoring-sasl.yaml |
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary -kubernetes-version 1.36.0 -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          -

      - name: kubeconform (flux)
        run: >-
          awk 'FNR==1{print "---"} 1' deploy/flux/clusters/hermes/*.yaml
          deploy/flux/clusters/hermes/flux-system/gotk-sync.yaml deploy/flux/namespaces/*.yaml
          deploy/flux/releases/*.yaml deploy/flux/images/*.yaml deploy/flux/notifications/*.yaml
          deploy/flux/cloudflared/*.yaml
          | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary -kubernetes-version 1.36.0 -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          -

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [cluster, cloudflare]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: fmt and validate
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo/deploy/terraform/${{ matrix.module }}
          --entrypoint sh hashicorp/terraform:1.16.6@sha256:bfffc1ded5fbf0a17beaaf22eb4793980abdb19d0761ff6a3a0efb2ab4d9b316 -c
          "terraform fmt -check -recursive && terraform init -backend=false -input=false >/dev/null
          && terraform validate"

  images:
    name: image ${{ matrix.service }}
    needs: [secrets, python, propagation, web, e2e, rust, authz, chart]
    # Only main ships images; branch runs stop after the tests to save Actions minutes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [agent, authz-sync, bronze-loader, company-loader, doc-fetcher, facts-fetcher,
                  parser, parser-rs, poller, query-api, web]
        context: [.]
        include:
          - service: migrate
            context: .
            file: db/Dockerfile
          - service: platform-setup
            context: .
            file: deploy/platform-setup/Dockerfile
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tributary-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('services/{0}/Dockerfile', matrix.service) }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  release:
    # Tag every image of a green main build at once; Flux deploys the highest build number.
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tag main-<run>-<sha>
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tributary"
          for s in agent authz-sync bronze-loader company-loader doc-fetcher facts-fetcher \
                   migrate parser parser-rs platform-setup poller query-api web; do
            docker buildx imagetools create \
              -t "$prefix-$s:main-${{ github.run_number }}-${{ github.sha }}" \
              "$prefix-$s:${{ github.sha }}"
          done

