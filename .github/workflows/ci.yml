name: CI
on: [push, pull_request]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan every commit, not just the latest
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1 git --redact --no-banner .

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tributary
          POSTGRES_PASSWORD: tributary
          POSTGRES_DB: tributary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tributary"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tributary:tributary@localhost:5432/tributary
      TEST_DATABASE_URL: postgresql://tributary:tributary@localhost:5432/tributary
      APP_DATABASE_URL: postgresql://tributary:tributary@localhost:5432/app
      APP_TEST_DATABASE_URL: postgresql://tributary:tributary@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest -e libs/sec -e libs/authz -e services/poller -e services/bronze-loader -e services/company-loader -e services/facts-fetcher -e services/doc-fetcher -e services/parser -e services/authz-sync -e 'services/query-api[test]'
      - run: ruff check .
      - run: ./scripts/create-databases.sh
      - run: ./scripts/migrate.sh db/migrations "$DATABASE_URL"
      - run: ./scripts/migrate.sh db/app/migrations "$APP_DATABASE_URL"
      - run: pytest

  authz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenFGA model tests
        run: >-
          docker run --rm -v "$PWD/authz:/authz:ro" -w /authz
          openfga/cli:v0.6.3 model test --tests model.fga.yaml
