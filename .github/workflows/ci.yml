name: CI
on: [push, pull_request]

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # scan every commit, not just the latest
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git --redact --no-banner .
      - name: deploy/secrets encrypted with sops
        run: pip install pyyaml==6.0.3 && python scripts/check-secrets-encrypted.py

  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: tributary
          POSTGRES_PASSWORD: tributary
          POSTGRES_DB: tributary
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tributary"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://tributary:tributary@localhost:5432/tributary
      TEST_DATABASE_URL: postgresql://tributary:tributary@localhost:5432/tributary
      APP_DATABASE_URL: postgresql://tributary:tributary@localhost:5432/app
      APP_TEST_DATABASE_URL: postgresql://tributary:tributary@localhost:5432/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff pytest pytest-cov pyright -e libs/telemetry -e libs/sec -e libs/authz -e services/poller -e services/bronze-loader -e services/company-loader -e services/facts-fetcher -e services/doc-fetcher -e services/parser -e services/authz-sync -e 'services/query-api[test]' -e services/agent
      - run: ruff check .
      - run: pyright --pythonpath "$(which python)"
      - run: ./scripts/create-databases.sh
      - run: ./scripts/migrate.sh db/migrations "$DATABASE_URL"
      - run: ./scripts/migrate.sh db/app/migrations "$APP_DATABASE_URL"
      - name: Rust parser service, for the parser equivalence test
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          cargo +1.99.1 build --locked --bin parser --manifest-path services/parser-rs/Cargo.toml
          echo "PARSER_RS_BIN=$PWD/services/parser-rs/target/debug/parser" >> "$GITHUB_ENV"
      - run: pytest --cov --cov-report=term
      - if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    container: rust:1.99.1-slim-trixie@sha256:4df2ae8cfdfebdfc13a65da7f253b73d68983dc0339f2719bc17a279c913b13d
    defaults:
      run:
        working-directory: services/parser-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: apt-get update && apt-get install -y --no-install-recommends make g++  # librdkafka
      - run: rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  authz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: OpenFGA model tests
        run: >-
          docker run --rm -v "$PWD/authz:/authz:ro" -w /authz
          openfga/cli:v0.6.3@sha256:4f3bf5ec0e79e20eb6e400f98431d23eda259faf71dfaf72b2f196d7823a3ef9 model test --tests model.fga.yaml

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: helm lint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
          lint --strict deploy/helm/tributary --set image.tag=ci
      - name: kubeconform
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
          template tributary deploy/helm/tributary --namespace tributary --set image.tag=ci
          | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary -kubernetes-version 1.36.0 -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          -
      - name: helm lint (platform)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
          lint --strict deploy/helm/platform --set images.setup.tag=ci
      - name: kubeconform (platform)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9
          template platform deploy/helm/platform --namespace platform --set images.setup.tag=ci
          | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary -kubernetes-version 1.36.0 -

      - name: helm lint (monitoring)
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint sh alpine/helm:3.19.0@sha256:aef9b56f64e866207d9591d0abd8f6d767b36aadd12edf68f8a719716d9d29c9 -c
          "helm repo add prometheus-community https://prometheus-community.github.io/helm-charts >/dev/null
          && helm repo add grafana https://grafana.github.io/helm-charts >/dev/null
          && helm dependency build deploy/helm/monitoring
          && helm lint --strict deploy/helm/monitoring
          && helm template monitoring deploy/helm/monitoring --namespace monitoring > monitoring.yaml"
      - name: kubeconform (monitoring)
        run: >-
          docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary -kubernetes-version 1.36.0 -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          - < monitoring.yaml

      - name: kubeconform (flux)
        run: >-
          awk 'FNR==1{print "---"} 1' deploy/flux/clusters/hermes/*.yaml
          deploy/flux/clusters/hermes/flux-system/gotk-sync.yaml deploy/flux/namespaces/*.yaml
          deploy/flux/releases/*.yaml deploy/flux/images/*.yaml deploy/flux/notifications/*.yaml
          deploy/flux/cloudflared/*.yaml
          | docker run --rm -i ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c
          -strict -summary -kubernetes-version 1.36.0 -schema-location default
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          -

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [cluster, cloudflare]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: fmt and validate
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo/deploy/terraform/${{ matrix.module }}
          --entrypoint sh hashicorp/terraform:1.16.6@sha256:bfffc1ded5fbf0a17beaaf22eb4793980abdb19d0761ff6a3a0efb2ab4d9b316 -c
          "terraform fmt -check -recursive && terraform init -backend=false -input=false >/dev/null
          && terraform validate"

  images:
    name: image ${{ matrix.service }}
    needs: [secrets, python, web, rust, authz, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [agent, authz-sync, bronze-loader, company-loader, doc-fetcher, facts-fetcher,
                  parser, parser-rs, poller, query-api, web]
        context: [.]
        include:
          - service: migrate
            context: .
            file: db/Dockerfile
          - service: platform-setup
            context: .
            file: deploy/platform-setup/Dockerfile
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tributary-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file || format('services/{0}/Dockerfile', matrix.service) }}
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  release:
    # Tag every image of a green main build at once; Flux deploys the highest build number.
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tag main-<run>-<sha>
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tributary"
          for s in agent authz-sync bronze-loader company-loader doc-fetcher facts-fetcher \
                   migrate parser parser-rs platform-setup poller query-api web; do
            docker buildx imagetools create \
              -t "$prefix-$s:main-${{ github.run_number }}-${{ github.sha }}" \
              "$prefix-$s:${{ github.sha }}"
          done

