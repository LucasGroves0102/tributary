# TLS-only Postgres for the Rust parser's sslmode test (ci.yml, python job): plaintext TCP is
# rejected, so a successful TCP connection proves the client used TLS.
local     all all             trust
hostssl   all all 0.0.0.0/0   scram-sha-256
hostssl   all all ::/0        scram-sha-256
host      all all 0.0.0.0/0   reject
host      all all ::/0        reject
