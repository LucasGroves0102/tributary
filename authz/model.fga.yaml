# Run: make authz-test
name: Tributary access model
model_file: ./model.fga

tuples:
  # every company with data is in catalog:sec and points at both tier objects (authz-sync);
  # company:fund stands for private data outside any catalog: only a grant opens it
  - {user: tier:financials, relation: financials_tier, object: company:nvda}
  - {user: tier:filings, relation: filings_tier, object: company:nvda}
  - {user: tier:financials, relation: financials_tier, object: company:tsla}
  - {user: tier:filings, relation: filings_tier, object: company:tsla}
  - {user: tier:financials, relation: financials_tier, object: company:fund}
  - {user: tier:filings, relation: filings_tier, object: company:fund}
  - {user: catalog:sec, relation: catalog, object: company:nvda}
  - {user: catalog:sec, relation: catalog, object: company:tsla}

  # alice: financials tier only, granted Nvidia and the private fund directly
  - {user: user:alice, relation: subscriber, object: tier:financials}
  - {user: user:alice, relation: viewer, object: company:nvda}
  - {user: user:alice, relation: viewer, object: company:fund}

  # bob: both tiers, member of acme, which is granted Nvidia
  - {user: user:bob, relation: subscriber, object: tier:financials}
  - {user: user:bob, relation: subscriber, object: tier:filings}
  - {user: user:bob, relation: member, object: organization:acme}
  - {user: organization:acme#member, relation: viewer, object: company:nvda}

  # carol: both tiers, no grants at all
  - {user: user:carol, relation: subscriber, object: tier:financials}
  - {user: user:carol, relation: subscriber, object: tier:filings}

  # erin: no subscription, so no tiers

# The global tuples leave the catalog closed. Tests with their own `tuples:` add
# catalog:sec#reader@user:*, the switch on.
tests:
  - name: Financials tier reads granted financials but not filings
    check:
      - user: user:alice
        object: company:nvda
        assertions: {viewer: true, can_read_financials: true, can_read_filings: false}

  - name: Closed catalog grants nothing; no grant means no access, whatever the plan
    check:
      - user: user:alice
        object: company:tsla
        assertions: {viewer: false, can_read_financials: false, can_read_filings: false}
      - user: user:carol
        object: company:nvda
        assertions: {viewer: false, can_read_financials: false, can_read_filings: false}
      - user: user:carol
        object: catalog:sec
        assertions: {reader: false}

  - name: Organization grant reaches its members, and the filings tier adds filings
    check:
      - user: user:bob
        object: company:nvda
        assertions: {viewer: true, can_read_financials: true, can_read_filings: true}
      - user: user:bob
        object: company:tsla
        assertions: {can_read_financials: false, can_read_filings: false}

  - name: Listing what a user can read (catalog closed)
    list_objects:
      - user: user:bob
        type: company
        assertions:
          can_read_filings: [company:nvda]
      - user: user:alice
        type: company
        assertions:
          can_read_financials: [company:fund, company:nvda]
          can_read_filings: []
      - user: user:carol
        type: company
        assertions:
          can_read_financials: []

  - name: Public catalog opens every catalog company to every user, within their tiers
    tuples:
      - {user: "user:*", relation: reader, object: catalog:sec}
    check:
      - user: user:carol
        object: catalog:sec
        assertions: {reader: true}
      - user: user:carol
        object: company:tsla
        assertions: {viewer: true, can_read_financials: true, can_read_filings: true}
      - user: user:alice
        object: company:tsla
        assertions: {viewer: true, can_read_financials: true, can_read_filings: false}
      - user: user:erin
        object: company:nvda
        assertions: {viewer: true, can_read_financials: false, can_read_filings: false}

  - name: A public catalog never opens a company outside it; private grants still apply
    tuples:
      - {user: "user:*", relation: reader, object: catalog:sec}
    check:
      - user: user:carol
        object: company:fund
        assertions: {viewer: false, can_read_financials: false, can_read_filings: false}
      - user: user:bob
        object: company:fund
        assertions: {viewer: false, can_read_financials: false}
      - user: user:alice
        object: company:fund
        assertions: {viewer: true, can_read_financials: true, can_read_filings: false}

  - name: Listing what a user can read (catalog public)
    tuples:
      - {user: "user:*", relation: reader, object: catalog:sec}
    list_objects:
      - user: user:carol
        type: company
        assertions:
          can_read_filings: [company:nvda, company:tsla]
      - user: user:alice
        type: company
        assertions:
          can_read_financials: [company:fund, company:nvda, company:tsla]
          can_read_filings: []
      - user: user:carol
        type: catalog
        assertions:
          reader: [catalog:sec]
